<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Killers V2 — SANLEAN</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>body{min-height:100vh}.sim-wrap{max-width:1280px;margin:0 auto;padding:140px 28px 80px}.sim-title{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-size:clamp(72px,6.4vw,108px);line-height:.9;margin:0 0 44px;color:#fff}.sim-title span{color:#ff003c}.deck-info{text-align:center;margin:18px auto 28px;font:700 14px Montserrat,Arial,sans-serif;color:#fff}.deck-info strong{color:#ff003c}.killer-reel{position:relative;height:370px;overflow:hidden}.killer-reel canvas{width:100%;height:100%;display:block}.sim-controls{display:flex;justify-content:center;margin-top:24px}.donor-help{text-align:center;color:rgba(255,255,255,.58);font:600 11px/1.6 Montserrat,Arial,sans-serif;margin-top:14px}.donor-help b{color:#ff003c}.sim-error{color:#ff003c;text-align:center;font:700 14px Montserrat,Arial,sans-serif;margin:20px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a><nav class="main-nav"><ul><li><a class="nav-link" href="Usuario/">MI PANEL</a></li><li><a class="nav-link" href="ruleta-killer.html">VOLVER A LA WEB</a></li></ul></nav></div></header><main class="sim-wrap"><h1 class="sim-title">RULETA DE <span>KILLERS</span> DE DBD</h1><div class="killer-reel"><canvas id="killerTrack"></canvas><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div id="deckInfo" class="deck-info">LEYENDO MI PANEL…</div><div class="sim-controls"><button class="btn" id="spinBtn">GIRAR</button></div><p class="donor-help">Esta prueba vuelve a leer <b>MI PANEL</b> cada vez que tocás GIRAR. Cada Killer activo aporta 1 carta y cada nombre agregado aporta 1 carta adicional.</p><p id="error" class="sim-error" hidden></p></main><script>(async()=>{const KEY='sanlean-roulette-simulation-v1',canvas=document.getElementById('killerTrack'),info=document.getElementById('deckInfo'),btn=document.getElementById('spinBtn'),err=document.getElementById('error');let killers=[],frame=null,spinning=false,last=null,cache=new Map();try{killers=await fetch('data/killers.json?simv2=1',{cache:'no-store'}).then(r=>r.json())}catch(e){err.hidden=false;err.textContent='NO SE PUDO CARGAR LA LISTA DE KILLERS';return}const frameImg=new Image();frameImg.src='Rectangulo.png';frame=frameImg;function readState(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function getWeight(state,k){const v=state.weights?.['killers:'+k.key];return v==null?1:Math.max(0,Number(v)||0)}function getDonors(state,k){const a=state.bonusEntries?.['killers:'+k.key];return Array.isArray(a)?a.map(x=>String(x||'').trim()).filter(Boolean):[]}function buildDeck(){const state=readState(),deck=[];let donated=0,disabled=0;killers.forEach(k=>{const w=getWeight(state,k),ds=getDonors(state,k);if(w<=0){disabled++;return}deck.push({killer:k,donor:null,id:k.key+':base'});ds.forEach((name,i)=>{deck.push({killer:k,donor:name,id:k.key+':donor:'+i});donated++})});info.innerHTML=`<strong>${deck.length} CARTAS ACTIVAS</strong> · ${donated} AGREGADAS · ${disabled} KILLERS DESHABILITADOS`;return deck}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function image(k){if(cache.has(k.key))return cache.get(k.key);const im=new Image();im.src=k.image;cache.set(k.key,im);return im}killers.forEach(image);function setup(){const w=canvas.clientWidth||1180,h=canvas.clientHeight||370,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return{c,w,h}}function portrait(c,im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;c.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function card(c,e,x,itemW,h,sel=false){const scale=sel?1.2:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,l=cx-cw/2,t=cy-ch/2;c.save();if(sel&&e.donor){c.shadowColor='#ff003c';c.shadowBlur=30}c.fillStyle='rgba(3,3,4,.96)';c.fillRect(l,t,cw,ch);c.shadowBlur=0;if(frame?.complete)c.drawImage(frame,l,t,cw,ch);const im=image(e.killer);if(im.complete){c.save();c.beginPath();c.rect(l+8,t+7,cw-16,ch-50);c.clip();portrait(c,im,l+8,t+7,cw-16,ch-50);c.restore()}c.textAlign='center';c.textBaseline='middle';c.shadowColor='#000';c.shadowBlur=5;c.fillStyle='#fff';c.font=`800 ${sel?19:17}px Montserrat,Arial,sans-serif`;c.fillText(e.killer.name.toUpperCase(),cx,t+ch-28,cw-18);if(e.donor){c.fillStyle='#ff003c';c.font=`800 ${sel?19:17}px Montserrat,Arial,sans-serif`;c.fillText(e.donor,cx,cy,cw-20)}c.restore()}function render(deck,pos,selected=-1){const{c,w,h}=setup(),itemW=210,center=w/2;c.clearRect(0,0,w,h);const first=Math.max(0,Math.floor(pos)-5),lastI=Math.min(deck.length-1,Math.ceil(pos)+5);for(let i=first;i<=lastI;i++){const x=center+(pos-i)*itemW-itemW/2;if(x>-itemW&&x<w+itemW)card(c,deck[i],x,itemW,h,i===selected)}}function staticView(){const deck=buildDeck();if(!deck.length)return;const row=shuffle(deck).slice(0,Math.min(7,deck.length));while(row.length<7&&deck.length)row.push(...shuffle(deck).slice(0,7-row.length));render(row,Math.floor(row.length/2),-1)}async function spin(){if(spinning)return;let deck=buildDeck();if(deck.length<2)return;deck=shuffle(deck);spinning=true;btn.disabled=true;const targetIndex=Math.floor(deck.length*.75+Math.random()*Math.max(1,deck.length*.2));const ti=Math.min(deck.length-1,Math.max(1,targetIndex)),duration=7600,start=performance.now();function frameLoop(now){const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,4),pos=ti*ease;render(deck,pos,p===1?ti:-1);if(p<1)requestAnimationFrame(frameLoop);else{last=deck[ti];spinning=false;btn.disabled=false}}requestAnimationFrame(frameLoop)}btn.onclick=spin;window.addEventListener('storage',()=>{if(!spinning)staticView()});window.addEventListener('resize',()=>{if(!spinning)staticView()});setTimeout(staticView,180)})();</script></body></html>
