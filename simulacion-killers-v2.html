<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Killers V2 — SANLEAN</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>body{min-height:100vh}.sim-wrap{max-width:1280px;margin:0 auto;padding:140px 28px 80px}.sim-title{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;font-size:clamp(72px,6.4vw,108px);line-height:.9;margin:0 0 44px;color:#fff}.sim-title span{color:#ff003c}.deck-info{text-align:center;margin:18px auto 28px;font:700 14px Montserrat,Arial,sans-serif;color:#fff}.deck-info strong{color:#ff003c}.killer-reel{position:relative;height:370px;overflow:hidden}.killer-reel canvas{width:100%;height:100%;display:block}.sim-controls{display:flex;justify-content:center;margin-top:24px}.donor-help{text-align:center;color:rgba(255,255,255,.58);font:600 11px/1.6 Montserrat,Arial,sans-serif;margin-top:14px}.donor-help b{color:#ff003c}.sim-error{color:#ff003c;text-align:center;font:700 14px Montserrat,Arial,sans-serif;margin:20px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a><nav class="main-nav"><ul><li><a class="nav-link" href="Usuario/">MI PANEL</a></li><li><a class="nav-link" href="ruleta-killer.html">VOLVER A LA WEB</a></li></ul></nav></div></header><main class="sim-wrap"><h1 class="sim-title">RULETA DE <span>KILLERS</span> DE DBD</h1><div class="killer-reel"><canvas id="killerTrack"></canvas><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div id="deckInfo" class="deck-info">LEYENDO MI PANEL…</div><div class="sim-controls"><button class="btn" id="spinBtn">GIRAR</button></div><p class="donor-help">Esta prueba vuelve a leer <b>MI PANEL</b> cada vez que tocás GIRAR. Cada Killer activo aporta 1 carta y cada nombre agregado aporta 1 carta adicional.</p><p id="error" class="sim-error" hidden></p></main><script>(async()=>{const KEY='sanlean-roulette-simulation-v1',canvas=document.getElementById('killerTrack'),info=document.getElementById('deckInfo'),btn=document.getElementById('spinBtn'),err=document.getElementById('error');let killers=[],frame=null,spinning=false,lastRow=null,cache=new Map();try{killers=await fetch('data/killers.json?simv2=8',{cache:'no-store'}).then(r=>r.json())}catch(e){err.hidden=false;err.textContent='NO SE PUDO CARGAR LA LISTA DE KILLERS';return}const frameImg=new Image();frameImg.src='rectangulo-fondo.png';frame=frameImg;function readState(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function getWeight(state,k){const v=state.weights?.['killers:'+k.key];return v==null?1:Math.max(0,Number(v)||0)}function getDonors(state,k){const a=state.bonusEntries?.['killers:'+k.key];return Array.isArray(a)?a.map(x=>String(x||'').trim()).filter(Boolean):[]}function buildDeck(){const state=readState(),deck=[];let donated=0,disabled=0;killers.forEach(k=>{if(getWeight(state,k)<=0){disabled++;return}deck.push({killer:k,donor:null,id:k.key+':base'});getDonors(state,k).forEach((name,i)=>{deck.push({killer:k,donor:name,id:k.key+':donor:'+i});donated++})});info.innerHTML=`<strong>${deck.length} CARTAS ACTIVAS</strong> · ${donated} AGREGADAS · ${disabled} KILLERS DESHABILITADOS`;return deck}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function image(k){if(cache.has(k.key))return cache.get(k.key);const im=new Image();im.src=k.image;cache.set(k.key,im);return im}killers.forEach(image);function setup(resize=true){const w=canvas.clientWidth||1180,h=canvas.clientHeight||370,dpr=Math.min(devicePixelRatio||1,2),c=canvas.getContext('2d');if(resize&&(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr))){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}c.setTransform(dpr,0,0,dpr,0,0);return{c,w,h}}function portrait(c,im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;c.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function card(c,e,x,itemW,h,sel=false,alpha=1){const scale=sel?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,l=cx-cw/2,t=cy-ch/2;c.save();c.globalAlpha=alpha;if(sel&&e.donor){c.shadowColor='#ff003c';c.shadowBlur=30}c.fillStyle='rgba(3,3,4,.94)';c.fillRect(l,t,cw,ch);c.shadowBlur=0;if(frame?.complete){c.save();c.globalAlpha=.72;c.drawImage(frame,l,t,cw,ch);c.restore()}const im=image(e.killer);if(im.complete){c.save();c.beginPath();c.rect(l+8,t+7,cw-16,ch-50);c.clip();c.filter='brightness(1.23) contrast(1.035)';portrait(c,im,l+8,t+7,cw-16,ch-50);c.filter='none';c.restore()}c.textAlign='center';c.textBaseline='middle';c.shadowColor='#000';c.shadowBlur=5;c.fillStyle='#fff';c.font=`800 ${sel?19:17}px Montserrat,Arial,sans-serif`;c.fillText(e.killer.name.toUpperCase(),cx,t+ch-28,cw-18);if(e.donor){const donorY=cy+15;c.font=`800 ${sel?25:22}px Montserrat,Arial,sans-serif`;c.fillStyle='#ff003c';c.shadowOffsetX=0;c.shadowOffsetY=1;c.shadowColor='rgba(0,0,0,1)';c.shadowBlur=6;c.fillText(e.donor,cx,donorY,cw-20);c.shadowOffsetY=0;c.shadowBlur=2;c.fillText(e.donor,cx,donorY,cw-20)}c.restore()}function renderAt(seq,pos,selected=-1){const{c,w,h}=setup(false),itemW=210,center=w/2;c.clearRect(0,0,w,h);const first=Math.max(0,Math.floor(pos)-5),last=Math.min(seq.length-1,Math.ceil(pos)+5);for(let i=first;i<=last;i++){const x=center+(pos-i)*itemW-itemW/2;if(x<-itemW*1.3||x>w+itemW*.3)continue;const dist=Math.abs(x+itemW/2-center);card(c,seq[i],x,itemW,h,i===selected,Math.max(.74,1-dist/(w*1.7)))}}function staticView(){setup(true);const entries=buildDeck();if(!entries.length)return;if(lastRow){const centerIndex=Math.floor(lastRow.length/2);renderAt(lastRow,centerIndex,centerIndex)}else{let row=shuffle(entries);if(row.length<7){const copy=[...row];while(row.length<7)row.push(...copy)}renderAt(row.slice(0,7),3,-1)}}function buildSpinDeck(entries){const deck=shuffle(entries);if(deck.length<2)return{deck,targetIndex:0,target:deck[0]};const targetIndex=Math.max(1,deck.length-4),randomIndex=Math.floor(Math.random()*deck.length);[deck[targetIndex],deck[randomIndex]]=[deck[randomIndex],deck[targetIndex]];return{deck,targetIndex,target:deck[targetIndex]}}function spin(entries){const{deck,targetIndex,target}=buildSpinDeck(entries);setup(true);const duration=8000,startPos=0,endPos=targetIndex,start=performance.now(),brakeStart=.78;return new Promise(resolve=>{function tick(now){const p=Math.min(1,(now-start)/duration);let progress;if(p<brakeStart)progress=(p/brakeStart)*.86;else{const q=(p-brakeStart)/(1-brakeStart);progress=.86+.14*(1-Math.pow(1-q,4))}renderAt(deck,startPos+(endPos-startPos)*progress,-1);if(p<1)return requestAnimationFrame(tick);const from=Math.max(0,targetIndex-3),to=Math.min(deck.length,targetIndex+4);lastRow=deck.slice(from,to);const selected=targetIndex-from;renderAt(lastRow,selected,selected);resolve(target)}requestAnimationFrame(tick)})}btn.onclick=async()=>{if(spinning)return;const entries=buildDeck();if(entries.length<2)return;spinning=true;btn.disabled=true;try{await spin(entries)}finally{spinning=false;btn.disabled=false}};window.addEventListener('storage',()=>{if(!spinning){lastRow=null;staticView()}});window.addEventListener('resize',()=>{if(!spinning)staticView()});setTimeout(staticView,180)})();</script></body></html>
