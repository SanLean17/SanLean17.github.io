<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Ruleta Killer — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.sim-wrap{max-width:1180px;margin:0 auto}.sim-reel{display:flex;gap:14px;align-items:center;justify-content:center;min-height:370px;overflow:hidden}.sim-card{position:relative;width:196px;height:278px;flex:0 0 196px;background:#050506;opacity:.72;transform:scale(.92);transition:.25s}.sim-card img{width:100%;height:230px;object-fit:contain;display:block}.sim-card .nm{text-align:center;color:#fff;font:800 17px Montserrat,Arial,sans-serif}.sim-card.win{opacity:1;transform:scale(1.16)}.sim-card.win.donated{filter:drop-shadow(0 0 16px #ff003c)}.sim-card .donor{display:block;color:#ff003c;font:inherit;margin-top:4px}.simulation-note{text-align:center;color:rgba(255,255,255,.55);font:600 10px/1.5 Montserrat,Arial,sans-serif;margin:20px 0}.simulation-note strong{color:#ff003c}.sim-actions{text-align:center;margin:18px 0 40px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="sim-wrap"><div class="sim-reel" id="simReel"></div><div class="sim-actions"><button class="btn" id="spin">GIRAR</button></div><p id="note" class="simulation-note" hidden>SIMULACIÓN DE <strong>MI PANEL</strong> ACTIVA EN ESTE NAVEGADOR</p></div></main><script src="js/main.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json'),KEY='sanlean-roulette-simulation-v1',reel=document.getElementById('simReel'),btn=document.getElementById('spin');let sim={weights:{},bonusEntries:{}};try{sim=Object.assign(sim,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}const w=k=>Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1)),donors=k=>(sim.bonusEntries&&sim.bonusEntries['killers:'+k.key]||[]).filter(Boolean);document.getElementById('note').hidden=!(Object.keys(sim.weights||{}).some(k=>k.startsWith('killers:'))||Object.keys(sim.bonusEntries||{}).some(k=>k.startsWith('killers:')));function entries(){const a=[];killers.forEach(k=>{const n=w(k);if(!n)return;const ds=donors(k);a.push({killer:k,donor:null});ds.forEach(d=>a.push({killer:k,donor:d}));for(let i=0;i<Math.max(0,n-1-ds.length);i++)a.push({killer:k,donor:null})});return a}function card(e,win=false){const d=document.createElement('div');d.className='sim-card'+(win?' win':'')+(win&&e.donor?' donated':'');d.innerHTML=`<img src="${e.killer.image||''}" alt=""><div class="nm">${e.killer.name}${win&&e.donor?`<span class="donor">${e.donor}</span>`:''}</div>`;return d}function renderWinner(win){reel.innerHTML='';const pool=killers.filter(k=>w(k)>0),others=[];while(others.length<4&&pool.length){const k=pool[Math.floor(Math.random()*pool.length)];if(k.key!==win.killer.key&&!others.some(x=>x.key===k.key))others.push(k)}const arr=[{killer:others[0]||win.killer},{killer:others[1]||win.killer},win,{killer:others[2]||win.killer},{killer:others[3]||win.killer}];arr.forEach((e,i)=>reel.appendChild(card(e,i===2)))}function initial(){const es=entries();if(es.length)renderWinner(es[Math.floor(Math.random()*es.length)])}btn.onclick=()=>{const es=entries();if(!es.length)return;btn.disabled=true;let ticks=0;const timer=setInterval(()=>{renderWinner(es[Math.floor(Math.random()*es.length)]);if(++ticks>=18){clearInterval(timer);const winner=es[Math.floor(Math.random()*es.length)];renderWinner(winner);btn.disabled=false}},90)};initial()})().catch(console.error);</script></body></html>
