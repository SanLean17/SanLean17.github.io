<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruleta de Perks de Superviviente — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"></head><body class="page-bg perk-roulette-page"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a><button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button><nav class="main-nav" id="mainNav"><ul><li class="has-dropdown"><span class="nav-link">DEAD BY DAYLIGHT</span><ul class="dropdown"><li><a href="ruleta-killer.html">RULETA KILLER</a></li><li><a href="ruleta-perks.html">RULETA PERKS</a></li></ul></li><li><a href="halloween.html" class="nav-link">HALLOWEEN</a></li><li class="has-dropdown"><span class="nav-link">TIERLIST</span><ul class="dropdown"><li><a href="tierlist-dbd.html">DEAD BY DAYLIGHT</a></li><li><a href="tierlist-halloween.html">HALLOWEEN</a></li></ul></li><li><a href="creditos.html" class="nav-link">CREDITOS</a></li></ul></nav></div></header><main class="container roulette-page survivor-perk-page"><h1>RULETA DE <span class="accent">PERKS</span><br>DE <span class="accent">SUPERVIVIENTE</span></h1><div class="build-grid"><div class="build-slot"><canvas class="reel-canvas" id="track0"></canvas><div class="reel-name" id="name0"></div></div><div class="build-slot"><canvas class="reel-canvas" id="track1"></canvas><div class="reel-name" id="name1"></div></div><div class="build-slot"><canvas class="reel-canvas" id="track2"></canvas><div class="reel-name" id="name2"></div></div><div class="build-slot"><canvas class="reel-canvas" id="track3"></canvas><div class="reel-name" id="name3"></div></div></div><div class="perk-spin-controls"><button class="btn" id="spinBtn">GIRAR</button><button class="perk-gear-btn" id="perkGearBtn" type="button" aria-label="Configurar Perks" aria-expanded="false" data-tooltip="Configurar Perks">&#9881;</button></div><section class="config-section perk-gear-config" id="configSection"><div class="config-head"><h3 class="config-toggle open" id="cfgToggle">CONFIGURAR PERKS <span class="arrow">›</span></h3><input class="perk-search" id="perkSearch" type="search" placeholder="BUSCAR PERK..." autocomplete="off" aria-label="Buscar perk"></div><p class="config-hint">Si te faltan algunas perks, hacé click para deshabilitar las que no tengas o no quieras.</p><div class="config-grid" id="cfgGrid"></div></section></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const perks=await loadJSON('data/perks-survivor.json');const conflicts=await loadJSON('data/perk-conflicts.json');const disabled=new Set();const grid=document.getElementById('cfgGrid'),section=document.getElementById('configSection'),gear=document.getElementById('perkGearBtn'),toggle=document.getElementById('cfgToggle'),search=document.getElementById('perkSearch');initConfigGrid(grid,perks,'survivor',disabled);addSelectAllCard(grid,perks,disabled);initPerkSearch(search,grid);await preloadImages(perks,'survivor');gear.addEventListener('click',()=>{const opening=!section.classList.contains('gear-visible');section.classList.toggle('gear-visible',opening);section.classList.toggle('open',opening);grid.classList.toggle('open',opening);gear.classList.toggle('active',opening);gear.setAttribute('aria-expanded',String(opening));toggle.classList.toggle('open',opening);if(opening)setTimeout(()=>section.scrollIntoView({behavior:'smooth',block:'start'}),80)});toggle.addEventListener('click',()=>{const opening=!section.classList.contains('gear-visible');section.classList.toggle('gear-visible',opening);section.classList.toggle('open',opening);grid.classList.toggle('open',opening);gear.classList.toggle('active',opening);gear.setAttribute('aria-expanded',String(opening));toggle.classList.toggle('open',opening)});const tracks=[0,1,2,3].map(i=>document.getElementById('track'+i));const names=[0,1,2,3].map(i=>document.getElementById('name'+i));const spinBtn=document.getElementById('spinBtn');let spinning=false;async function spin(){if(spinning)return;const enabled=perks.filter(p=>!disabled.has(p.key));if(enabled.length<4)return;spinning=true;spinBtn.classList.add('is-spinning');names.forEach(n=>n.textContent='');const chosen=pickBuildOf4(perks,disabled,conflicts.survivor||[]);await Promise.all(tracks.map((c,i)=>spinTrack(c,enabled,'survivor',chosen[i],true,180,i*140)));chosen.forEach((p,i)=>names[i].textContent=p.name);spinBtn.classList.remove('is-spinning');spinning=false}spinBtn.addEventListener('click',spin);tracks.forEach(c=>c.addEventListener('click',spin))})().catch(console.error);</script></body></html>
