<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Killer — Perks Engine 1 Slot Horizontal</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.debug{max-width:1000px;margin:18px auto;text-align:center;color:#888;font:600 11px Montserrat,Arial,sans-serif}.debug strong,.donor-proof{color:#ff003c}.killer-spin-controls{display:flex;justify-content:center}.killer-reel{position:relative;overflow:hidden}.perk-horizontal-stage{position:absolute;inset:0;z-index:2}.perk-horizontal-card{position:absolute;left:50%;top:50%;width:196px;height:278px;transform:translate(-50%,-50%);background:#030304;will-change:transform,opacity}.perk-horizontal-card img.frame{position:absolute;inset:0;width:100%;height:100%}.perk-horizontal-card .portrait-box{position:absolute;left:8px;right:8px;top:7px;bottom:50px;overflow:hidden}.perk-horizontal-card img.portrait{width:100%;height:100%;object-fit:contain;transform:scale(1.19);filter:brightness(1.23) contrast(1.035)}.perk-horizontal-card .killer-name{position:absolute;left:8px;right:8px;bottom:16px;text-align:center;color:#fff;font:800 17px/1.05 Montserrat,Arial,sans-serif;text-shadow:0 0 5px #000}.perk-horizontal-card .donor-name{position:absolute;z-index:6;left:8px;right:8px;top:56%;transform:translateY(-50%);text-align:center;color:#ff003c;font:900 22px/1 Montserrat,Arial,sans-serif;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.perk-horizontal-card.winner{transform:translate(-50%,-50%) scale(1.22)!important;z-index:20}.perk-horizontal-card.winner.donated{filter:drop-shadow(0 0 12px #ff003c) drop-shadow(0 0 25px #ff003c)}.perk-horizontal-card.winner .killer-name{font-size:19px}.perk-horizontal-card.winner .donor-name{font-size:25px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><div id="stage" class="perk-horizontal-stage"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="debug" class="debug"></p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json'),SIM_KEY='sanlean-roulette-simulation-v1',stage=document.getElementById('stage'),btn=document.getElementById('spinKillerBtn'),debug=document.getElementById('debug');let sim={weights:{},bonusEntries:{}},spinning=false,current=null;function reload(){try{sim={weights:{},bonusEntries:{},...JSON.parse(localStorage.getItem(SIM_KEY)||'{}')}catch{sim={weights:{},bonusEntries:{}}}}function weight(k){return Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1))}function donors(k){return(sim.bonusEntries&&sim.bonusEntries['killers:'+k.key]||[]).map(v=>String(v||'').trim()).filter(Boolean)}function weightedEntries(){reload();const out=[];killers.forEach(k=>{const w=weight(k);if(w===0||!k.image)return;const ds=donors(k);out.push({killer:k,donor:null});ds.forEach(d=>out.push({killer:k,donor:d}));for(let i=0;i<Math.max(0,w-1-ds.length);i++)out.push({killer:k,donor:null})});const d=out.filter(e=>e.donor),off=killers.filter(k=>weight(k)===0).length;debug.innerHTML=`<strong>${out.length} ENTRADAS</strong> · ${d.length} DE MI PANEL · ${off} DESHABILITADOS`+(d.length?` · <span class="donor-proof">${d.slice(0,5).map(e=>e.killer.name+' = '+e.donor).join(' / ')}</span>`:'');return out}function card(entry){const el=document.createElement('div');el.className='perk-horizontal-card'+(entry.donor?' donated':'');const f=document.createElement('img');f.className='frame';f.src='rectangulo-fondo.png';const box=document.createElement('div');box.className='portrait-box';const p=document.createElement('img');p.className='portrait';p.src=entry.killer.image;p.alt=entry.killer.name;box.appendChild(p);const n=document.createElement('div');n.className='killer-name';n.textContent=entry.killer.name.toUpperCase();el.append(f,box,n);if(entry.donor){const d=document.createElement('div');d.className='donor-name';d.textContent=entry.donor;el.appendChild(d)}return el}function show(entry,klass=''){stage.replaceChildren();const el=card(entry);if(klass)el.classList.add(klass);stage.appendChild(el);return el}function random(pool){return pool[Math.floor(Math.random()*pool.length)]}function preview(){if(spinning)return;const pool=weightedEntries();if(!pool.length)return;const donated=pool.filter(e=>e.donor);current=donated.length?random(donated):random(pool);show(current)}function spin(){if(spinning)return;const pool=weightedEntries();if(pool.length<2)return;const winner=random(pool);spinning=true;btn.disabled=true;const start=performance.now(),duration=8000,swapEvery=95;let lastSwap=-1,direction=1,el=null;function tick(now){const elapsed=now-start,p=Math.min(1,elapsed/duration);if(p>=1){current=winner;el=show(winner,'winner');spinning=false;btn.disabled=false;return}const slow=1+Math.pow(p,4)*8,slot=Math.floor(elapsed/(swapEvery*slow));if(slot!==lastSwap){lastSwap=slot;const entry=p>.90&&Math.random()<.45&&pool.some(e=>e.donor)?random(pool.filter(e=>e.donor)):random(pool);el=show(entry);direction*=-1}const amp=(1-p)*Math.min(300,stage.clientWidth*.28),phase=(elapsed/210)*Math.PI,offset=Math.sin(phase)*amp*direction,scale=1+Math.sin(Math.min(1,p)*Math.PI)*.025;el.style.transform=`translate(calc(-50% + ${offset}px),-50%) scale(${scale})`;el.style.opacity=String(Math.max(.76,1-Math.abs(offset)/(stage.clientWidth*.85)));requestAnimationFrame(tick)}requestAnimationFrame(tick)}btn.addEventListener('click',spin);window.addEventListener('focus',()=>{if(!spinning)preview()});window.addEventListener('storage',e=>{if(e.key===SIM_KEY&&!spinning)preview()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!spinning)preview()});preview()})();</script></body></html>
