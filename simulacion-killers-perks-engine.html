<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Killer — Motor Perks Horizontal</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.debug{max-width:1000px;margin:18px auto;text-align:center;color:#888;font:600 11px Montserrat,Arial,sans-serif}.debug strong{color:#ff003c}.killer-spin-controls{display:flex;justify-content:center}.donor-proof{color:#ff003c}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="debug" class="debug"></p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json'),SIM_KEY='sanlean-roulette-simulation-v1';let sim={weights:{},bonusEntries:{}};function reloadSim(){try{sim={weights:{},bonusEntries:{},...JSON.parse(localStorage.getItem(SIM_KEY)||'{}')}catch{sim={weights:{},bonusEntries:{}}}}reloadSim();const weight=k=>Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1)),donors=k=>(sim.bonusEntries&&sim.bonusEntries['killers:'+k.key]||[]).map(v=>String(v||'').trim()).filter(Boolean);function entries(){reloadSim();const out=[];killers.forEach(k=>{const w=weight(k);if(w===0||!k.image)return;const ds=donors(k);out.push({killer:k,donor:null,id:k.key+':base'});ds.forEach((d,i)=>out.push({killer:k,donor:d,id:k.key+':donor:'+i}));for(let i=0;i<Math.max(0,w-1-ds.length);i++)out.push({killer:k,donor:null,id:k.key+':extra:'+i})});const d=out.filter(e=>e.donor),off=killers.filter(k=>weight(k)===0).length;document.getElementById('debug').innerHTML=`<strong>${out.length} ENTRADAS</strong> · ${d.length} DE MI PANEL · ${off} DESHABILITADOS`+(d.length?` · <span class="donor-proof">${d.slice(0,5).map(e=>e.killer.name+' = '+e.donor).join(' / ')}</span>`:'');return out}const canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),frameImg=await loadImage('rectangulo-fondo.png').catch(()=>null),cache=new Map();let spinning=false,lastRow=null;function setup(resize=true){const r=reel.getBoundingClientRect(),w=r.width,h=r.height,d=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');canvas.style.width=w+'px';canvas.style.height=h+'px';if(resize){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h}}function image(k){if(cache.has(k.key))return cache.get(k.key);const im=new Image();im.src=k.image;im.onload=()=>{if(!spinning)staticView()};cache.set(k.key,im);return im}killers.forEach(image);function fit(ctx,im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function draw(ctx,e,x,itemW,h,selected=false,alpha=1){const scale=selected?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,left=cx-cw/2,top=cy-ch/2,im=image(e.killer);ctx.save();ctx.globalAlpha=alpha;if(selected&&e.donor){ctx.shadowColor='#ff003c';ctx.shadowBlur=30}ctx.fillStyle='#030304';ctx.fillRect(left,top,cw,ch);ctx.shadowBlur=0;if(frameImg){ctx.save();ctx.globalAlpha=.78;ctx.drawImage(frameImg,left,top,cw,ch);ctx.restore()}if(im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(left+8,top+7,cw-16,ch-50);ctx.clip();ctx.filter='brightness(1.23) contrast(1.035)';fit(ctx,im,left+8,top+7,cw-16,ch-50);ctx.restore()}ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillStyle='#fff';ctx.font=`800 ${selected?19:17}px Montserrat,Arial,sans-serif`;ctx.fillText(e.killer.name.toUpperCase(),cx,top+ch-29,cw-18);if(e.donor){ctx.font=`900 ${selected?25:22}px Montserrat,Arial,sans-serif`;ctx.lineWidth=6;ctx.lineJoin='round';ctx.strokeStyle='#050505';ctx.strokeText(e.donor,cx,cy+18,cw-20);ctx.fillStyle='#ff003c';ctx.fillText(e.donor,cx,cy+18,cw-20)}ctx.restore()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(seq,pos,selected=-1){const{ctx,w,h}=setup(false),iw=210,center=w/2;ctx.clearRect(0,0,w,h);for(let i=Math.max(0,Math.floor(pos)-5);i<=Math.min(seq.length-1,Math.ceil(pos)+5);i++){const x=center+(pos-i)*iw-iw/2;if(x<-iw*1.3||x>w+iw*.3)continue;draw(ctx,seq[i],x,iw,h,i===selected,Math.max(.74,1-Math.abs(x+iw/2-center)/(w*1.7)))}}function staticView(){setup(true);const pool=entries();if(!pool.length)return;if(lastRow){const c=Math.floor(lastRow.length/2);render(lastRow,c,c);return}const d=shuffle(pool.filter(e=>e.donor)),n=shuffle(pool.filter(e=>!e.donor)),row=[];for(let i=0;i<7;i++)row.push(i%2===1&&d.length?d.shift():(n.shift()||d.shift()||pool[0]));render(row,3,-1)}function buildSequence(pool,winner){const seq=[];while(seq.length<58){for(const e of shuffle(pool)){if(seq.length>=58)break;seq.push(e)}}const ds=shuffle(pool.filter(e=>e.donor));for(let i=0;i<Math.min(5,ds.length);i++){const p=47+i*2;if(p<seq.length)seq[p]=ds[i]}seq.push(winner);return{seq,target:seq.length-1}}function ease(p){const b=.78;if(p<b)return(p/b)*.86;const q=(p-b)/(1-b);return.86+.14*(1-Math.pow(1-q,4))}function spin(){if(spinning)return;const pool=entries();if(pool.length<2)return;const winner=pool[Math.floor(Math.random()*pool.length)],built=buildSequence(pool,winner),start=performance.now(),duration=8000;spinning=true;btn.disabled=true;setup(true);function tick(now){const p=Math.min(1,(now-start)/duration),pos=(built.target)*ease(p);render(built.seq,pos,-1);if(p<1)return requestAnimationFrame(tick);const from=Math.max(0,built.target-3),to=Math.min(built.seq.length,built.target+4);lastRow=built.seq.slice(from,to);const selected=built.target-from;render(lastRow,selected,selected);spinning=false;btn.disabled=false}requestAnimationFrame(tick)}function sync(){if(!spinning){lastRow=null;staticView()}}btn.onclick=spin;window.addEventListener('resize',sync);window.addEventListener('focus',sync);window.addEventListener('storage',e=>{if(e.key===SIM_KEY)sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});staticView()})();</script></body></html>
