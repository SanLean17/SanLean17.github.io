<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Killer — Motor Perks Horizontal DOM</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.debug{max-width:1000px;margin:18px auto;text-align:center;color:#888;font:600 11px Montserrat,Arial,sans-serif}.debug strong,.donor-proof{color:#ff003c}.killer-spin-controls{display:flex;justify-content:center}.killer-reel{position:relative;overflow:hidden}.dom-reel-track{position:absolute;left:0;top:50%;display:flex;align-items:center;gap:14px;will-change:transform;z-index:2}.dom-killer-card{position:relative;flex:0 0 196px;width:196px;height:278px;background:#030304;overflow:visible}.dom-killer-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.dom-killer-imagebox{position:absolute;left:8px;right:8px;top:7px;bottom:50px;overflow:hidden}.dom-killer-image{width:100%;height:100%;object-fit:contain;transform:scale(1.19);filter:brightness(1.23) contrast(1.035)}.dom-killer-name{position:absolute;left:8px;right:8px;bottom:16px;color:#fff;text-align:center;font:800 17px/1.05 Montserrat,Arial,sans-serif;text-shadow:0 0 5px #000}.dom-killer-donor{position:absolute;z-index:6;left:8px;right:8px;top:56%;transform:translateY(-50%);color:#ff003c;text-align:center;font:900 22px/1 Montserrat,Arial,sans-serif;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dom-killer-card.selected{transform:scale(1.22);z-index:20}.dom-killer-card.selected.donated{filter:drop-shadow(0 0 12px #ff003c) drop-shadow(0 0 25px #ff003c)}.dom-killer-card.selected .dom-killer-name{font-size:19px}.dom-killer-card.selected .dom-killer-donor{font-size:25px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><div id="killerDomTrack" class="dom-reel-track"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="debug" class="debug"></p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json'),SIM_KEY='sanlean-roulette-simulation-v1',track=document.getElementById('killerDomTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),debug=document.getElementById('debug');const CARD=196,GAP=14,STEP=CARD+GAP;let sim={weights:{},bonusEntries:{}},spinning=false;function reload(){try{sim={weights:{},bonusEntries:{},...JSON.parse(localStorage.getItem(SIM_KEY)||'{}')}catch{sim={weights:{},bonusEntries:{}}}}function weight(k){return Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1))}function donors(k){return(sim.bonusEntries&&sim.bonusEntries['killers:'+k.key]||[]).map(v=>String(v||'').trim()).filter(Boolean)}function weightedEntries(){reload();const out=[];killers.forEach(k=>{const w=weight(k);if(w===0||!k.image)return;const ds=donors(k);out.push({killer:k,donor:null});ds.forEach(d=>out.push({killer:k,donor:d}));for(let i=0;i<Math.max(0,w-1-ds.length);i++)out.push({killer:k,donor:null})});const d=out.filter(e=>e.donor),off=killers.filter(k=>weight(k)===0).length;debug.innerHTML=`<strong>${out.length} ENTRADAS</strong> · ${d.length} DE MI PANEL · ${off} DESHABILITADOS`+(d.length?` · <span class="donor-proof">${d.slice(0,5).map(e=>e.killer.name+' = '+e.donor).join(' / ')}</span>`:'');return out}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function card(entry){const el=document.createElement('div');el.className='dom-killer-card'+(entry.donor?' donated':'');const frame=document.createElement('img');frame.className='dom-killer-frame';frame.src='rectangulo-fondo.png';frame.alt='';const box=document.createElement('div');box.className='dom-killer-imagebox';const image=document.createElement('img');image.className='dom-killer-image';image.src=entry.killer.image;image.alt=entry.killer.name;box.appendChild(image);const name=document.createElement('div');name.className='dom-killer-name';name.textContent=entry.killer.name.toUpperCase();el.append(frame,box,name);if(entry.donor){const donor=document.createElement('div');donor.className='dom-killer-donor';donor.textContent=entry.donor;el.appendChild(donor)}return el}function mount(seq){track.replaceChildren(...seq.map(card))}function xFor(index){return reel.clientWidth/2-CARD/2-index*STEP}function position(index){track.style.transform=`translate3d(${xFor(index)}px,-50%,0)`}function preview(){if(spinning)return;const pool=weightedEntries();if(!pool.length)return;const d=shuffle(pool.filter(e=>e.donor)),n=shuffle(pool.filter(e=>!e.donor)),row=[];for(let i=0;i<9;i++)row.push(i%2===1&&d.length?d.shift():(n.shift()||d.shift()||pool[0]));mount(row);position(4)}function buildSequence(pool,winner){const seq=[];while(seq.length<60){for(const e of shuffle(pool)){if(seq.length>=60)break;seq.push(e)}}seq.push(winner);return{seq,target:seq.length-1}}function ease(p){const b=.78;if(p<b)return(p/b)*.86;const q=(p-b)/(1-b);return.86+.14*(1-Math.pow(1-q,4))}function spin(){if(spinning)return;const pool=weightedEntries();if(pool.length<2)return;const winner=pool[Math.floor(Math.random()*pool.length)],built=buildSequence(pool,winner),start=performance.now(),duration=8000,startIndex=1;spinning=true;btn.disabled=true;mount(built.seq);function tick(now){const p=Math.min(1,(now-start)/duration),idx=startIndex+(built.target-startIndex)*ease(p);position(idx);if(p<1)return requestAnimationFrame(tick);track.children[built.target]?.classList.add('selected');spinning=false;btn.disabled=false}requestAnimationFrame(tick)}function sync(){if(!spinning)preview()}btn.addEventListener('click',spin);window.addEventListener('resize',sync);window.addEventListener('focus',sync);window.addEventListener('storage',e=>{if(e.key===SIM_KEY)sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});preview()})();</script></body></html>
