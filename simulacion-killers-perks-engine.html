<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Killer — Motor Perks</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><style>
body{background:#050507}.test-page{padding-top:144px}.test-page h1{text-align:center}.killer-build{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-width:1040px;margin:42px auto 0}.killer-slot{position:relative;min-width:0;height:360px;overflow:hidden}.killer-slot canvas{width:100%;height:100%;display:block}.killer-result{position:absolute;left:12px;right:12px;bottom:20px;z-index:4;text-align:center;color:#fff;font:800 17px/1.05 Montserrat,Arial,sans-serif;text-shadow:0 2px 5px #000}.killer-result .donor{display:block;margin-top:6px;color:#ff003c;font-size:22px;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 6px #000}.killer-slot.donated{filter:drop-shadow(0 0 13px #ff003c)}.controls{text-align:center;margin-top:28px}.controls .btn{border:0;border-radius:999px;background:#ff003c;color:white;padding:13px 38px;font:800 14px Montserrat,Arial,sans-serif;cursor:pointer}.debug{max-width:1000px;margin:20px auto;text-align:center;color:#888;font:600 11px Montserrat,Arial,sans-serif}.debug strong{color:#ff003c}@media(max-width:800px){.killer-build{grid-template-columns:repeat(2,1fr)}.test-page{padding-top:100px}}
</style></head><body class="page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page test-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-build"><div class="killer-slot"><canvas id="track0"></canvas><div class="killer-result" id="name0"></div></div><div class="killer-slot"><canvas id="track1"></canvas><div class="killer-result" id="name1"></div></div><div class="killer-slot"><canvas id="track2"></canvas><div class="killer-result" id="name2"></div></div><div class="killer-slot"><canvas id="track3"></canvas><div class="killer-result" id="name3"></div></div></div><div class="controls"><button class="btn" id="spinBtn">GIRAR</button></div><p class="debug" id="debug"></p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>
(async()=>{const killers=await loadJSON('data/killers.json');const SIM_KEY='sanlean-roulette-simulation-v1';let sim={weights:{},bonusEntries:{}};try{sim=Object.assign(sim,JSON.parse(localStorage.getItem(SIM_KEY)||'{}'))}catch(e){}const weightFor=k=>Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1));const donorsFor=k=>(sim.bonusEntries&&sim.bonusEntries['killers:'+k.key]||[]).map(x=>String(x||'').trim()).filter(Boolean);const disabled=new Set(killers.filter(k=>weightFor(k)===0).map(k=>k.key));function weightedEntries(){const out=[];killers.forEach(k=>{if(disabled.has(k.key))return;const donors=donorsFor(k),w=weightFor(k);out.push({killer:k,donor:null});donors.forEach(d=>out.push({killer:k,donor:d}));for(let i=0;i<Math.max(0,w-1-donors.length);i++)out.push({killer:k,donor:null})});return out}const entries=weightedEntries(),donated=entries.filter(e=>e.donor);document.getElementById('debug').innerHTML=`<strong>${entries.length} ENTRADAS</strong> · ${donated.length} DE MI PANEL · ${disabled.size} DESHABILITADOS`+(donated.length?` · ${donated.slice(0,5).map(e=>e.killer.name+' = '+e.donor).join(' / ')}`:'');await preloadImages(killers,'killer');const tracks=[0,1,2,3].map(i=>document.getElementById('track'+i)),names=[0,1,2,3].map(i=>document.getElementById('name'+i)),slots=tracks.map(c=>c.closest('.killer-slot')),btn=document.getElementById('spinBtn');let spinning=false;function choose(){const pool=weightedEntries();return pool[Math.floor(Math.random()*pool.length)]}function clear(){slots.forEach((s,i)=>{s.classList.remove('donated');names[i].textContent=''})}async function spin(){if(spinning)return;const enabled=killers.filter(k=>!disabled.has(k.key)&&weightFor(k)>0);if(!enabled.length)return;const chosen=[choose(),choose(),choose(),choose()];spinning=true;btn.disabled=true;clear();await Promise.all(tracks.map((c,i)=>spinTrack(c,enabled,'killer',chosen[i].killer,true,180,i*140)));chosen.forEach((entry,i)=>{names[i].textContent=entry.killer.name;if(entry.donor){slots[i].classList.add('donated');const d=document.createElement('span');d.className='donor';d.textContent=entry.donor;names[i].appendChild(d)}});spinning=false;btn.disabled=false}btn.addEventListener('click',spin);tracks.forEach(c=>c.addEventListener('click',spin));})();
</script></body></html>
