<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Ruleta Killer — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/killer-page.css"><style>
.simulation-note{max-width:860px;margin:18px auto 0;text-align:center;color:rgba(255,255,255,.55);font:600 10px/1.5 Montserrat,Arial,sans-serif}.simulation-note strong{color:#ff003c}.killer-spin-controls{display:flex;justify-content:center;margin-top:18px}.killer-spin-controls .btn{border:0;border-radius:999px;background:#ff003c;color:#fff;font:800 14px Montserrat,Arial,sans-serif;padding:12px 34px;cursor:pointer}.killer-spin-controls .btn:disabled{opacity:.55;cursor:default}
#killerReel{position:relative;overflow:hidden;height:370px;width:100%}.dom-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:14px;will-change:transform;z-index:2}.dom-card{position:relative;flex:0 0 196px;width:196px;height:278px;background:#030304 url('rectangulo-fondo.png') center/100% 100% no-repeat;transform-origin:center;transition:filter .28s ease,transform .28s ease}.dom-card-imgbox{position:absolute;inset:7px 8px 50px;overflow:hidden}.dom-card-img{width:100%;height:100%;object-fit:contain;transform:scale(1.19);filter:brightness(1.23) contrast(1.035)}.dom-killer-name{position:absolute;left:8px;right:8px;bottom:16px;text-align:center;color:#fff;font:800 17px/1.05 Montserrat,Arial,sans-serif;text-shadow:0 0 4px #000}.dom-donor{position:absolute;z-index:5;left:8px;right:8px;top:53%;transform:translateY(-50%);text-align:center;color:#ff003c;font:900 22px/1 Montserrat,Arial,sans-serif;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 6px #000;overflow:hidden;text-overflow:ellipsis}.dom-card.winner{transform:scale(1.22);z-index:20}.dom-card.winner.donated{filter:drop-shadow(0 0 9px #ff003c) drop-shadow(0 0 22px #ff003c)}.dom-card.winner .dom-killer-name{font-size:19px}.dom-card.winner .dom-donor{font-size:25px}.sim-marker{position:absolute;left:50%;transform:translateX(-50%);z-index:30;width:0;height:0;pointer-events:none}.sim-marker.top{top:6px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid #ff003c}.sim-marker.bottom{bottom:6px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid #ff003c}.sim-fade{position:absolute;top:0;bottom:0;width:120px;z-index:25;pointer-events:none}.sim-fade.left{left:0;background:linear-gradient(90deg,#050507,transparent)}.sim-fade.right{right:0;background:linear-gradient(270deg,#050507,transparent)}
</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div id="killerReel"><div id="domTrack" class="dom-track"></div><div class="sim-fade left"></div><div class="sim-fade right"></div><div class="sim-marker top"></div><div class="sim-marker bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="deckInfo" class="simulation-note"></p></main><script src="js/main.js"></script><script>
(async()=>{const killers=await loadJSON('data/killers.json'),KEY='sanlean-roulette-simulation-v1',track=document.getElementById('domTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),info=document.getElementById('deckInfo');const CARD=196,GAP=14,STEP=CARD+GAP;let spinning=false;
function readState(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}
function buildDeck(){const s=readState(),deck=[];let added=0,off=0;for(const k of killers){const key='killers:'+k.key,w=s.weights?.[key]==null?1:Number(s.weights[key])||0,donors=Array.isArray(s.bonusEntries?.[key])?s.bonusEntries[key].map(v=>String(v??'').trim()).filter(Boolean):[];if(w<=0){off++;continue}deck.push({killer:k,donor:null,id:k.key+'::base'});donors.forEach((name,i)=>{deck.push({killer:k,donor:name,id:`${k.key}::donor::${i}::${name}`});added++})}info.innerHTML=`<strong>${deck.length} CARTAS ACTIVAS</strong> · ${added} AGREGADAS · ${off} KILLERS DESHABILITADOS`;return deck}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeCard(entry){const el=document.createElement('div');el.className='dom-card'+(entry.donor?' donated':'');const box=document.createElement('div');box.className='dom-card-imgbox';const im=document.createElement('img');im.className='dom-card-img';im.src=entry.killer.image;im.alt=entry.killer.name;box.appendChild(im);el.appendChild(box);const kn=document.createElement('div');kn.className='dom-killer-name';kn.textContent=entry.killer.name.toUpperCase();el.appendChild(kn);if(entry.donor){const dn=document.createElement('div');dn.className='dom-donor';dn.textContent=entry.donor;el.appendChild(dn)}return el}
function setTrack(entries){track.replaceChildren(...entries.map(makeCard))}
function xFor(index){return reel.clientWidth/2-CARD/2-index*STEP}
function preview(){if(spinning)return;const deck=buildDeck();if(!deck.length)return;const donors=shuffle(deck.filter(x=>x.donor)),bases=shuffle(deck.filter(x=>!x.donor)),row=[];for(let i=0;i<9;i++)row.push(i%2===1&&donors.length?donors.shift():(bases.shift()||donors.shift()||deck[0]));setTrack(row);track.style.transform=`translate3d(${xFor(4)}px,0,0)`}
function sequence(pool,winner){const seq=[];while(seq.length<56){for(const e of shuffle(pool)){if(seq.length>=56)break;seq.push(e)}}seq.push(winner);return{seq,index:seq.length-1}}
function easing(p){const brake=.78;if(p<brake)return(p/brake)*.86;const q=(p-brake)/(1-brake);return.86+.14*(1-Math.pow(1-q,4))}
function spin(){if(spinning)return;const pool=buildDeck();if(pool.length<2)return;spinning=true;btn.disabled=true;const winner=pool[Math.floor(Math.random()*pool.length)],s=sequence(pool,winner);setTrack(s.seq);const start=performance.now(),duration=8000,startIndex=1;function tick(now){const p=Math.min(1,(now-start)/duration),pos=startIndex+(s.index-startIndex)*easing(p);track.style.transform=`translate3d(${xFor(pos)}px,0,0)`;if(p<1)return requestAnimationFrame(tick);track.children[s.index]?.classList.add('winner');spinning=false;btn.disabled=false}requestAnimationFrame(tick)}
function sync(){if(!spinning)preview()}btn.addEventListener('click',spin);window.addEventListener('resize',sync);window.addEventListener('focus',sync);window.addEventListener('storage',e=>{if(e.key===KEY)sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});preview()})();
</script></body></html>
