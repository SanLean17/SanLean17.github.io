<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Ruleta Killer — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.simulation-note{max-width:860px;margin:18px auto 0;text-align:center;color:rgba(255,255,255,.55);font:600 10px/1.5 Montserrat,Arial,sans-serif}.simulation-note strong{color:#ff003c}.killer-card-name{flex-direction:column;gap:2px}.killer-card-name .sim-donor-name{display:block;color:#ff003c;font-family:Montserrat,Arial,sans-serif;font-size:22px;font-weight:900;line-height:1;text-transform:none;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 6px #000}.killer-card.sim-donated .killer-card-name{bottom:8px;min-height:62px}.killer-card.selected.sim-donated{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 24px #ff003c)}.killer-card.selected .killer-card-name .sim-donor-name{font-size:25px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><div class="killer-track" id="killerDomTrack"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="deckInfo" class="simulation-note"></p></main><script src="js/main.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json'),SIM_KEY='sanlean-roulette-simulation-v1',track=document.getElementById('killerDomTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),info=document.getElementById('deckInfo');const CARD=196,GAP=14,STEP=CARD+GAP;let spinning=false;function state(){try{return JSON.parse(localStorage.getItem(SIM_KEY)||'{}')}catch{return{weights:{},bonusEntries:{}}}}function weightFor(k,s){return Math.max(0,Number((s.weights&&s.weights['killers:'+k.key])??1))}function donorsFor(k,s){return(s.bonusEntries&&s.bonusEntries['killers:'+k.key]||[]).map(v=>String(v??'').trim()).filter(Boolean)}function weightedEntries(){const s=state(),out=[];let added=0,off=0;killers.forEach(k=>{const w=weightFor(k,s);if(w===0){off++;return}const ds=donorsFor(k,s);out.push({killer:k,donor:null,id:k.key+':base'});ds.forEach((d,i)=>{out.push({killer:k,donor:d,id:k.key+':donor:'+i});added++});for(let i=0;i<Math.max(0,w-1-ds.length);i++)out.push({killer:k,donor:null,id:k.key+':extra:'+i})});info.innerHTML=`<strong>${out.length} CARTAS ACTIVAS</strong> · ${added} AGREGADAS · ${off} KILLERS DESHABILITADOS`;return out}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function card(e){const el=document.createElement('div');el.className='killer-card'+(e.donor?' sim-donated':'');el.dataset.entry=e.id;const frame=document.createElement('img');frame.className='killer-card-frame';frame.src='rectangulo-fondo.png';frame.alt='';const portrait=document.createElement('img');portrait.className='killer-card-portrait';portrait.src=e.killer.image;portrait.alt=e.killer.name;const name=document.createElement('div');name.className='killer-card-name';const killerLine=document.createElement('span');killerLine.textContent=e.killer.name;name.appendChild(killerLine);if(e.donor){const donorLine=document.createElement('span');donorLine.className='sim-donor-name';donorLine.textContent=e.donor;name.appendChild(donorLine)}el.append(frame,portrait,name);return el}function mount(seq){track.replaceChildren(...seq.map(card));track.style.transition='none'}function xFor(index){return -index*STEP-CARD/2}function setPos(index){track.style.transform=`translate3d(${xFor(index)}px,-50%,0)`}function preview(){if(spinning)return;const entries=weightedEntries();if(!entries.length)return;const donors=shuffle(entries.filter(e=>e.donor)),normal=shuffle(entries.filter(e=>!e.donor)),row=[];for(let i=0;i<9;i++)row.push(i%2===1&&donors.length?donors.shift():(normal.shift()||donors.shift()||entries[0]));mount(row);setPos(4)}function buildSequence(entries,winner){const seq=[];while(seq.length<68){for(const e of shuffle(entries)){if(seq.length>=68)break;seq.push(e)}}const donors=shuffle(entries.filter(e=>e.donor));const brakePositions=[52,55,58,61,64,66];donors.slice(0,brakePositions.length).forEach((e,i)=>seq[brakePositions[i]]=e);seq.push(winner);return{seq,target:seq.length-1}}function ease(p){const brake=.78;if(p<brake)return(p/brake)*.86;const q=(p-brake)/(1-brake);return.86+.14*(1-Math.pow(1-q,4))}function spin(){if(spinning)return;const entries=weightedEntries();if(entries.length<2)return;const winner=entries[Math.floor(Math.random()*entries.length)],built=buildSequence(entries,winner);spinning=true;btn.disabled=true;mount(built.seq);const start=performance.now(),duration=8000,startIndex=1;function tick(now){const p=Math.min(1,(now-start)/duration),pos=startIndex+(built.target-startIndex)*ease(p);setPos(pos);if(p<1)return requestAnimationFrame(tick);track.children[built.target]?.classList.add('selected');spinning=false;btn.disabled=false}requestAnimationFrame(tick)}function sync(){if(!spinning)preview()}btn.addEventListener('click',spin);window.addEventListener('resize',sync);window.addEventListener('focus',sync);window.addEventListener('storage',e=>{if(e.key===SIM_KEY)sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});preview()})();</script></body></html>
