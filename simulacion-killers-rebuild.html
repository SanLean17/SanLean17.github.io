<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Ruleta Killer — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.simulation-note{max-width:860px;margin:18px auto 0;text-align:center;color:rgba(255,255,255,.55);font:600 10px/1.5 Montserrat,Arial,sans-serif}.simulation-note strong{color:#ff003c}.killer-spin-controls{display:flex;align-items:center;justify-content:center;gap:12px}.donor-layer{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}.donor-label{position:absolute;transform:translate(-50%,-50%);color:#ff003c;font:900 22px/1 Montserrat,Arial,sans-serif;text-align:center;white-space:nowrap;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 5px #000}.donor-label.selected{font-size:25px;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 8px #000,0 0 18px #ff003c}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div id="donorLayer" class="donor-layer"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="deckInfo" class="simulation-note"></p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json');const KEY='sanlean-roulette-simulation-v1',canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),layer=document.getElementById('donorLayer'),btn=document.getElementById('spinKillerBtn'),info=document.getElementById('deckInfo');let spinning=false,lastRow=null;const frame=await loadImage('rectangulo-fondo.png').catch(()=>null),cache=new Map();function state(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function entries(){const s=state(),a=[];let added=0,off=0;for(const k of killers){const id='killers:'+k.key,w=s.weights?.[id]==null?1:Number(s.weights[id])||0,names=Array.isArray(s.bonusEntries?.[id])?s.bonusEntries[id].map(v=>String(v||'').trim()).filter(Boolean):[];if(w<=0){off++;continue}a.push({item:k,donor:null,id:k.key+':base'});for(let i=0;i<names.length;i++){a.push({item:k,donor:names[i],id:k.key+':donor:'+i});added++}}info.innerHTML=`<strong>${a.length} CARTAS ACTIVAS</strong> · ${added} AGREGADAS · ${off} KILLERS DESHABILITADOS`;return a}function setup(resize=true){const rect=reel.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height),d=Math.min(devicePixelRatio||1,2),c=canvas.getContext('2d');canvas.style.width=w+'px';canvas.style.height=h+'px';if(resize&&(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d))){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}c.setTransform(d,0,0,d,0,0);return{c,w,h}}function img(k){if(cache.has(k.key))return cache.get(k.key);const i=new Image();i.decoding='async';i.src=k.image;i.onload=()=>{if(!spinning)staticView()};cache.set(k.key,i);return i}killers.forEach(img);function portrait(c,i,x,y,w,h){if(!i.complete||!i.naturalWidth)return;const s=Math.min(w/i.naturalWidth,h/i.naturalHeight)*1.19,iw=i.naturalWidth*s,ih=i.naturalHeight*s;c.drawImage(i,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function wrap(n){n=n.toUpperCase();if(n.length<=20||!n.includes(' '))return[n];const words=n.split(' '),r=['',''];for(const word of words){if((r[0]+' '+word).trim().length<=Math.ceil(n.length/2)+2)r[0]=(r[0]+' '+word).trim();else r[1]=(r[1]+' '+word).trim()}return r[1]?r:[n]}function geometry(x,itemW,h,sel){const scale=sel?1.22:1,w=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2;return{w,ch,cx,cy,l:cx-w/2,t:cy-ch/2}}function card(c,e,x,itemW,h,sel=false,alpha=1){const g=geometry(x,itemW,h,sel),im=img(e.item);c.save();c.globalAlpha=alpha;if(sel&&e.donor){c.shadowColor='#ff003c';c.shadowBlur=34}c.fillStyle='rgba(3,3,4,.94)';c.fillRect(g.l,g.t,g.w,g.ch);c.shadowBlur=0;if(frame){c.save();c.globalAlpha=.72;c.drawImage(frame,g.l,g.t,g.w,g.ch);c.restore()}if(im.complete&&im.naturalWidth){c.save();c.beginPath();c.rect(g.l+8,g.t+7,g.w-16,g.ch-50);c.clip();c.filter='brightness(1.23) contrast(1.035)';portrait(c,im,g.l+8,g.t+7,g.w-16,g.ch-50);c.filter='none';c.restore()}c.fillStyle='#fff';c.shadowColor='#000';c.shadowBlur=4;c.textAlign='center';c.textBaseline='middle';const lines=wrap(e.item.name),fs=sel?19:17,base=g.t+g.ch-(lines.length===2?43:31);c.font=`800 ${fs}px Montserrat,Arial,sans-serif`;lines.forEach((v,i)=>c.fillText(v,g.cx,base+i*(fs+2),g.w-18));c.restore()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(seq,pos,selected=-1){const{c,w,h}=setup(false),iw=210,center=w/2,labels=[];c.clearRect(0,0,w,h);const first=Math.max(0,Math.floor(pos)-5),last=Math.min(seq.length-1,Math.ceil(pos)+5);for(let i=first;i<=last;i++){const x=center+(i-pos)*iw-iw/2;if(x<-iw*1.3||x>w+iw*.3)continue;const alpha=Math.max(.74,1-Math.abs(x+iw/2-center)/(w*1.7)),sel=i===selected;card(c,seq[i],x,iw,h,sel,alpha);if(seq[i].donor){const g=geometry(x,iw,h,sel);labels.push({name:seq[i].donor,x:g.cx,y:g.cy+18,sel,max:g.w-20})}}layer.replaceChildren(...labels.map(v=>{const el=document.createElement('span');el.className='donor-label'+(v.sel?' selected':'');el.textContent=v.name;el.style.left=v.x+'px';el.style.top=v.y+'px';el.style.maxWidth=v.max+'px';return el}))}function preview(a){const d=shuffle(a.filter(e=>e.donor)),n=shuffle(a.filter(e=>!e.donor));if(!d.length)return shuffle(a).slice(0,7);const row=[];for(let i=0;i<7;i++){if(i%2===1&&d.length)row.push(d.shift());else row.push(n.shift()||d.shift()||a[0])}return row}function staticView(){setup(true);const a=entries();if(!a.length){layer.replaceChildren();return}if(lastRow){const m=Math.floor(lastRow.length/2);render(lastRow,m,m)}else render(preview(a),3,-1)}function sequence(pool,target){const seq=[],travel=52;let prev=null;while(seq.length<travel){const batch=shuffle(pool);if(prev&&batch.length>1&&batch[0].id===prev.id)[batch[0],batch[1]]=[batch[1],batch[0]];for(const e of batch){if(seq.length>=travel)break;seq.push(e);prev=e}}seq.push(target);return{seq,targetIndex:travel}}/* Movement intentionally unchanged. */function spin(pool,target){const{seq,targetIndex}=sequence(pool,target);setup(true);const duration=8000,startPos=1,endPos=targetIndex,start=performance.now(),brakeStart=.78;return new Promise(resolve=>{function loop(now){const p=Math.min(1,(now-start)/duration);let progress;if(p<brakeStart)progress=(p/brakeStart)*.86;else{const q=(p-brakeStart)/(1-brakeStart);progress=.86+.14*(1-Math.pow(1-q,4))}render(seq,startPos+(endPos-startPos)*progress,-1);if(p<1)return requestAnimationFrame(loop);const from=Math.max(0,targetIndex-3),to=Math.min(seq.length,targetIndex+4);lastRow=seq.slice(from,to);const m=targetIndex-from;render(lastRow,m,m);resolve()}requestAnimationFrame(loop)})}function sync(){if(!spinning){lastRow=null;staticView()}}setTimeout(staticView,180);window.addEventListener('load',staticView);window.addEventListener('resize',()=>{if(!spinning)staticView()});window.addEventListener('storage',e=>{if(e.key===KEY)sync()});window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});btn.onclick=async()=>{if(spinning)return;const pool=entries();if(pool.length<2)return;spinning=true;btn.disabled=true;try{await spin(pool,pool[Math.floor(Math.random()*pool.length)])}finally{spinning=false;btn.disabled=false}}})();</script></body></html>
