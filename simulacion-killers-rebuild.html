<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Ruleta Killer — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.simulation-note{max-width:860px;margin:18px auto 0;text-align:center;color:rgba(255,255,255,.55);font:600 10px/1.5 Montserrat,Arial,sans-serif}.simulation-note strong{color:#ff003c}.killer-spin-controls{display:flex;align-items:center;justify-content:center;gap:12px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="deckInfo" class="simulation-note"></p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json');const KEY='sanlean-roulette-simulation-v1',canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),info=document.getElementById('deckInfo');let spinning=false,lastRow=null;const frame=await loadImage('rectangulo-fondo.png').catch(()=>null),cache=new Map();function readState(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function makeCard(k,donor,index){return{killerKey:k.key,killerName:k.name,image:k.image,donor:donor||null,cardId:donor?`${k.key}::donor::${index}::${donor}`:`${k.key}::base`}}function buildDeck(){const s=readState(),deck=[];let added=0,off=0;for(const k of killers){const key='killers:'+k.key,weight=s.weights?.[key]==null?1:Number(s.weights[key])||0,donors=Array.isArray(s.bonusEntries?.[key])?s.bonusEntries[key].map(v=>String(v??'').trim()).filter(Boolean):[];if(weight<=0){off++;continue}deck.push(makeCard(k,null,0));donors.forEach((name,i)=>{deck.push(makeCard(k,name,i));added++})}info.innerHTML=`<strong>${deck.length} CARTAS ACTIVAS</strong> · ${added} AGREGADAS · ${off} KILLERS DESHABILITADOS`;return deck}function setup(resize=true){const r=reel.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height),d=Math.min(devicePixelRatio||1,2),c=canvas.getContext('2d');canvas.style.width=w+'px';canvas.style.height=h+'px';if(resize&&(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d))){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}c.setTransform(d,0,0,d,0,0);return{c,w,h}}function getImg(card){if(cache.has(card.killerKey))return cache.get(card.killerKey);const im=new Image();im.decoding='async';im.src=card.image;im.onload=()=>{if(!spinning)renderStatic()};cache.set(card.killerKey,im);return im}function fit(c,im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;c.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function wrapName(name){const n=name.toUpperCase();if(n.length<=20||!n.includes(' '))return[n];const words=n.split(' '),r=['',''];for(const word of words){if((r[0]+' '+word).trim().length<=Math.ceil(n.length/2)+2)r[0]=(r[0]+' '+word).trim();else r[1]=(r[1]+' '+word).trim()}return r[1]?[r[0],r[1]]:[n]}function drawCard(c,card,x,itemW,h,selected=false,alpha=1){const scale=selected?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,left=cx-cw/2,top=cy-ch/2,im=getImg(card);c.save();c.globalAlpha=alpha;if(selected&&card.donor){c.shadowColor='#ff003c';c.shadowBlur=34}c.fillStyle='rgba(3,3,4,.94)';c.fillRect(left,top,cw,ch);c.shadowBlur=0;if(frame){c.save();c.globalAlpha=.72;c.drawImage(frame,left,top,cw,ch);c.restore()}if(im.complete&&im.naturalWidth){c.save();c.beginPath();c.rect(left+8,top+7,cw-16,ch-50);c.clip();c.filter='brightness(1.23) contrast(1.035)';fit(c,im,left+8,top+7,cw-16,ch-50);c.filter='none';c.restore()}c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.shadowColor='#000';c.shadowBlur=4;const lines=wrapName(card.killerName),fs=selected?19:17,base=top+ch-(lines.length===2?43:31);c.font=`800 ${fs}px Montserrat,Arial,sans-serif`;lines.forEach((line,i)=>c.fillText(line,cx,base+i*(fs+2),cw-18));if(card.donor){const donorY=cy+18;c.font=`900 ${selected?25:22}px Montserrat,Arial,sans-serif`;c.lineJoin='round';c.strokeStyle='#050505';c.lineWidth=6;c.shadowColor='#000';c.shadowBlur=5;c.strokeText(card.donor,cx,donorY,cw-20);c.shadowBlur=0;c.fillStyle='#ff003c';c.fillText(card.donor,cx,donorY,cw-20)}c.restore()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(seq,pos,selected=-1){const{c,w,h}=setup(false),itemW=210,center=w/2;c.clearRect(0,0,w,h);const first=Math.max(0,Math.floor(pos)-5),last=Math.min(seq.length-1,Math.ceil(pos)+5);for(let i=first;i<=last;i++){const x=center+(i-pos)*itemW-itemW/2;if(x<-itemW*1.3||x>w+itemW*.3)continue;const alpha=Math.max(.74,1-Math.abs(x+itemW/2-center)/(w*1.7));drawCard(c,seq[i],x,itemW,h,i===selected,alpha)}}function preview(deck){const donors=shuffle(deck.filter(c=>c.donor)),bases=shuffle(deck.filter(c=>!c.donor));if(!donors.length)return shuffle(deck).slice(0,7);const row=[];for(let i=0;i<7;i++){if(i%2===1&&donors.length)row.push(donors.shift());else row.push(bases.shift()||donors.shift()||deck[0])}return row}function renderStatic(){setup(true);const deck=buildDeck();if(!deck.length)return;if(lastRow){const center=Math.floor(lastRow.length/2);render(lastRow,center,center)}else render(preview(deck),3,-1)}function buildSequence(pool,target){const seq=[],travel=52;let prev=null;while(seq.length<travel){const batch=shuffle(pool);if(prev&&batch.length>1&&batch[0].cardId===prev.cardId)[batch[0],batch[1]]=[batch[1],batch[0]];for(const card of batch){if(seq.length>=travel)break;seq.push(card);prev=card}}seq.push(target);return{seq,targetIndex:travel}}/* DO NOT CHANGE: approved roulette movement. */function spin(pool,target){const{seq,targetIndex}=buildSequence(pool,target);setup(true);const duration=8000,startPos=1,endPos=targetIndex,start=performance.now(),brakeStart=.78;return new Promise(resolve=>{function loop(now){const p=Math.min(1,(now-start)/duration);let progress;if(p<brakeStart)progress=(p/brakeStart)*.86;else{const q=(p-brakeStart)/(1-brakeStart);progress=.86+.14*(1-Math.pow(1-q,4))}render(seq,startPos+(endPos-startPos)*progress,-1);if(p<1)return requestAnimationFrame(loop);const from=Math.max(0,targetIndex-3),to=Math.min(seq.length,targetIndex+4);lastRow=seq.slice(from,to);const selected=targetIndex-from;render(lastRow,selected,selected);resolve()}requestAnimationFrame(loop)})}function sync(){if(!spinning){lastRow=null;renderStatic()}}killers.forEach(k=>getImg(makeCard(k,null,0)));setTimeout(renderStatic,180);window.addEventListener('load',renderStatic);window.addEventListener('resize',()=>{if(!spinning)renderStatic()});window.addEventListener('storage',e=>{if(e.key===KEY)sync()});window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});btn.onclick=async()=>{if(spinning)return;const pool=buildDeck();if(pool.length<2)return;spinning=true;btn.disabled=true;try{const winner=pool[Math.floor(Math.random()*pool.length)];await spin(pool,winner)}finally{spinning=false;btn.disabled=false}}})();</script></body></html>
