name: Códigos NightLight
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codigos-nightlight.yml'
      - 'scripts/sync_nightlight_codes.py'
permissions:
  contents: write
concurrency:
  group: sanlean-nightlight-codes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validar módulos y catálogo
        run: |
          node --check codigos/codigos.js
          node --check codigos/model.mjs
          node --check codigos/presentation.mjs
          node --test tests/codigos-layout.test.mjs
          python -m py_compile scripts/sync_nightlight_codes.py
      - run: python scripts/sync_nightlight_codes.py
      - name: Publicar catálogo si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codigos-nightlight.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo NightLight"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
