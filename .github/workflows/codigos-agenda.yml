name: Códigos · Agenda de respaldo
on:
  # Agenda independiente del cron principal, separada del minuto 00.
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codigos-agenda.yml'
      - 'scripts/codigos/agenda.mjs'
      - 'tests/codigos-agenda.test.mjs'
permissions:
  contents: read
  actions: write
concurrency:
  group: sanlean-codigos-agenda
  cancel-in-progress: false
jobs:
  comprobar:
    if: github.repository == 'SanLean17/SanLean17.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar reglas de la agenda
        run: node --test tests/codigos-agenda.test.mjs
      - name: Consultar última revisión y activar si está atrasada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-dbd-codes.yml/runs?per_page=30" > "${RUNNER_TEMP}/codigos-runs.json"
          node scripts/codigos/agenda.mjs "${RUNNER_TEMP}/codigos-runs.json"
