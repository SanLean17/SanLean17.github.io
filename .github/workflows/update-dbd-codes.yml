name: Update DBD codes
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dbd-codes.yml'
      - 'scripts/codigos/**'
      - 'codigos/presentation.mjs'
      - 'codigos/model.mjs'
      - 'tests/dbd-codes.test.mjs'
      - 'tests/codigos-multisource.test.mjs'
      - 'tests/fixtures/codigos/**'
permissions:
  contents: read
concurrency:
  group: update-dbd-codes
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: write
    env:
      CODE_STATE_PATH: /tmp/codigos-runtime/state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/codigos-runtime
          key: codigos-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codigos-v2-
      - name: Prepare local OCR for verified official images
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tesseract-ocr
          fi
          tesseract --version 2>&1 | head -n 1
      - name: Test conservative detection
        run: node --test tests/dbd-codes.test.mjs tests/codigos-multisource.test.mjs
      - name: Query independent public sources
        run: node scripts/codigos/update.mjs
      - name: Commit only meaningful catalog changes
        shell: bash
        run: |
          if git diff --quiet -- data/codigos.json data/codigos-review.json; then
            echo 'No data changes; no commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/codigos.json data/codigos-review.json
          git commit -m 'Update official DBD codes'
          for attempt in 1 2 3; do
            # La rama puede avanzar mientras se detectan códigos: actualizar
            # nuestra base sin perder el commit de catálogo recién generado.
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'Catálogo de códigos publicado.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'No se pudo publicar el catálogo tras tres intentos.' >&2
          exit 1
      - name: Save cursors and health without a repository commit
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/codigos-runtime
          key: codigos-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish public debug diagnostic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/codigos/publish-health.mjs
