name: DBD content architecture
on:
  pull_request:
  push:
    branches: [codex/dbd-content-catalogs]
permissions:
  contents: read
jobs:
  content:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogs and assets with Windows PowerShell
        shell: powershell
        run: ./maintenance/dbd-content/ContentTools.ps1 -Mode Validate
      - name: Test shared model, errors, ZIP contents and local progress migration
        run: node --test tests/dbd-catalog.test.cjs tests/dbd-maintenance.test.cjs tests/dbd-streamer-model.test.cjs
      - name: Preserve private settings and roulette behavior
        run: |
          node tests/private-settings.cjs
          node tests/killer-repeat-controller.cjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1 sharp@0.35.5 jszip@3.10.1
      - name: Test local content manager without publishing
        run: node --test tests/dbd-manager.test.cjs tests/dbd-manager-v2.test.cjs tests/dbd-manager-v3.test.cjs
      - name: Install test browser
        run: npx playwright install chromium
      - name: Test real public and private screens with staged and active fixtures
        run: |
          node tests/dbd-catalog-browser.cjs
          node tests/all-challenges.cjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbd-content-browser-evidence
          path: test-results/dbd-browser/
