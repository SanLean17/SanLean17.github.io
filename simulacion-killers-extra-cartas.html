<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulación Killers + MI PANEL</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--red:#ff003c;--card-w:206px;--card-h:286px;--gap:16px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090b url('assets/fondo-principal.png') center top/cover fixed no-repeat;color:#fff;font-family:Montserrat,Arial,sans-serif}.wrap{width:min(1180px,94vw);margin:auto;padding:28px 0 70px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:900;font-size:25px}.brand img{width:54px;height:54px;object-fit:contain}.brand b,.red{color:var(--red)}h1{text-align:center;font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(54px,7vw,105px);font-weight:900;margin:70px 0 42px;letter-spacing:1px}.status{margin:0 auto 22px;padding:14px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(8,8,11,.88);border-radius:12px;text-align:center;font-size:12px;font-weight:800}.status strong{color:var(--red)}.reel{position:relative;height:360px;overflow:hidden;background:rgba(0,0,0,.36);border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04)}.track{position:absolute;left:50%;top:50%;height:var(--card-h);display:flex;gap:var(--gap);align-items:center;will-change:transform;transform:translate3d(0,-50%,0)}.card{position:relative;flex:0 0 var(--card-w);width:var(--card-w);height:var(--card-h);background:#050507;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,0,60,.78);transform-origin:center;transition:transform .35s ease,filter .35s ease}.card:before{content:"";position:absolute;inset:0;z-index:2;background:url('Rectangulo.png') center/100% 100% no-repeat;pointer-events:none}.portrait{position:absolute;inset:8px 8px 43px;width:calc(100% - 16px);height:calc(100% - 51px);object-fit:contain;object-position:center bottom;filter:brightness(1.13) contrast(1.04)}.killer-name{position:absolute;z-index:3;left:7px;right:7px;bottom:12px;text-align:center;font-weight:900;font-size:16px;line-height:1;text-transform:uppercase;text-shadow:0 2px 4px #000}.donor-name{display:none;position:absolute;z-index:5;left:8px;right:8px;top:58%;transform:translateY(-50%);text-align:center;color:var(--red);font-weight:900;font-size:22px;line-height:1;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 8px #000}.card.winner{transform:scale(1.17);z-index:10}.card.winner.donated{filter:drop-shadow(0 0 10px var(--red)) drop-shadow(0 0 20px var(--red))}.card.winner.donated .donor-name{display:block;font-size:25px}.arrow{position:absolute;z-index:30;left:50%;transform:translateX(-50%);width:0;height:0}.arrow.top{top:4px;border-left:17px solid transparent;border-right:17px solid transparent;border-top:25px solid var(--red)}.arrow.bottom{bottom:4px;border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:25px solid var(--red)}.controls{text-align:center;padding-top:30px}.spin{border:0;border-radius:999px;background:var(--red);color:#fff;font:900 20px Impact,'Arial Narrow',sans-serif;padding:16px 54px;cursor:pointer}.spin:disabled{opacity:.4;cursor:not-allowed}.debug{margin-top:18px;text-align:center;font-size:11px;color:rgba(255,255,255,.6)}.debug b{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
<a class="brand" href="index.html"><img src="logo.png" alt="SanLean"><span><b>SAN</b>LEAN</span></a>
<h1>RULETA DE <span class="red">KILLERS</span> DE DBD</h1>
<div id="status" class="status">LEYENDO <strong>MI PANEL</strong>...</div>
<div id="reel" class="reel"><div id="track" class="track"></div><div class="arrow top"></div><div class="arrow bottom"></div></div>
<div class="controls"><button id="spin" class="spin" disabled>GIRAR</button></div>
<div id="debug" class="debug"></div>
</div>
<script>
(()=>{
'use strict';
const STORAGE='sanlean-roulette-simulation-v1';
const DATA='data/killers.json';
const track=document.getElementById('track'),spinBtn=document.getElementById('spin'),status=document.getElementById('status'),debug=document.getElementById('debug'),reel=document.getElementById('reel');
let killers=[],state={},entries=[],spinning=false,currentDeck=[];
const CARD_W=206,GAP=16,STEP=CARD_W+GAP;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function readState(){try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(e){state={}}state.weights=state.weights||{};state.bonusEntries=state.bonusEntries||{};}
function w(k){const raw=state.weights['killers:'+k.key];return raw===undefined?1:Math.max(0,Number(raw)||0)}
function names(k){const a=state.bonusEntries['killers:'+k.key];return Array.isArray(a)?a.map(v=>String(v||'').trim()).filter(Boolean):[]}
function rebuildEntries(){readState();entries=[];for(const k of killers){const weight=w(k);if(weight<=0)continue;entries.push({killer:k,donor:null,uid:k.key+':base'});const ds=names(k);ds.forEach((name,i)=>entries.push({killer:k,donor:name,uid:k.key+':donor:'+i}));for(let i=0;i<Math.max(0,weight-1-ds.length);i++)entries.push({killer:k,donor:null,uid:k.key+':extra:'+i})}const enabled=killers.filter(k=>w(k)>0),disabled=killers.filter(k=>w(k)<=0),donors=entries.filter(e=>e.donor);status.innerHTML=`MI PANEL: <strong>${enabled.length} KILLERS HABILITADOS</strong> · ${disabled.length} DESHABILITADOS · ${donors.length} PARTICIPACIONES CON NOMBRE`;debug.innerHTML=`MAZO REAL: <b>${entries.length} CARTAS</b> · ${enabled.map(k=>k.name).join(' · ')}`;spinBtn.disabled=entries.length<2;}
function cardHTML(e){const d=e.donor?`<div class="donor-name">${escapeHTML(e.donor)}</div>`:'';return `<div class="card${e.donor?' donated':''}" data-uid="${escapeHTML(e.uid)}"><img class="portrait" src="${escapeHTML(e.killer.image)}" alt=""><div class="killer-name">${escapeHTML(e.killer.name)}</div>${d}</div>`}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function makeDeck(min=80){const out=[];while(out.length<min)out.push(...shuffle(entries));return out.slice(0,Math.max(min,entries.length*6))}
function setTrack(deck){currentDeck=deck;track.innerHTML=deck.map(cardHTML).join('');track.style.transition='none';track.style.transform='translate3d(0,-50%,0)';}
function centerOffset(index){const reelCenter=reel.clientWidth/2;const cardCenter=index*STEP+CARD_W/2;return reelCenter-cardCenter}
function showIdle(){rebuildEntries();if(!entries.length){track.innerHTML='';return}const deck=makeDeck(Math.max(15,entries.length*2));setTrack(deck);const idx=Math.min(5,deck.length-1);track.style.transform=`translate3d(${centerOffset(idx)}px,-50%,0)`;}
function spin(){if(spinning)return;rebuildEntries();if(entries.length<2)return;spinning=true;spinBtn.disabled=true;const deck=makeDeck(Math.max(90,entries.length*8));setTrack(deck);const target=deck.length-7;const startIndex=4;track.style.transform=`translate3d(${centerOffset(startIndex)}px,-50%,0)`;track.getBoundingClientRect();requestAnimationFrame(()=>{track.style.transition='transform 8s cubic-bezier(.08,.62,.12,1)';track.style.transform=`translate3d(${centerOffset(target)}px,-50%,0)`;});const finish=()=>{track.removeEventListener('transitionend',finish);const cards=track.children;if(cards[target])cards[target].classList.add('winner');spinning=false;spinBtn.disabled=false};track.addEventListener('transitionend',finish,{once:true});setTimeout(()=>{if(spinning)finish()},8500)}
spinBtn.addEventListener('click',spin);
window.addEventListener('storage',e=>{if(e.key===STORAGE&&!spinning)showIdle()});
window.addEventListener('focus',()=>{if(!spinning)showIdle()});
window.addEventListener('resize',()=>{if(!spinning)showIdle()});
fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('killers.json');return r.json()}).then(data=>{killers=data;showIdle()}).catch(err=>{status.innerHTML='<strong>ERROR:</strong> NO SE PUDO CARGAR data/killers.json';console.error(err)});
})();
</script>
</body>
</html>
