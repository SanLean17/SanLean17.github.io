<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico MI PANEL — Killers</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.diagnostic{max-width:1180px;margin:18px auto 26px;padding:18px 20px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(15,15,18,.92);font:600 12px/1.55 Montserrat,Arial,sans-serif;color:#fff}.diagnostic h2{margin:0 0 12px;font-size:15px}.diag-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.diag-box{padding:12px;border-radius:10px;background:rgba(255,255,255,.055)}.diag-label{display:block;color:rgba(255,255,255,.52);font-size:10px}.diag-value{display:block;margin-top:4px;font-size:17px}.bad,.accent,.diag-list b{color:#ff003c}.diag-list{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);word-break:break-word}.simulation-note{text-align:center;color:rgba(255,255,255,.55);font:600 11px Montserrat,Arial,sans-serif}.winner-donor{position:absolute;z-index:50;left:50%;top:55%;transform:translate(-50%,-50%);color:#ff003c;font:800 22px/1 Montserrat,Arial,sans-serif;text-shadow:0 0 7px #000,-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505;pointer-events:none}.killer-reel.donor-winner canvas{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 24px #ff003c)}@media(max-width:800px){.diag-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><section class="diagnostic"><h2>DIAGNÓSTICO DE <span class="accent">MI PANEL</span></h2><div class="diag-grid"><div class="diag-box"><span class="diag-label">CLAVE EN LOCALSTORAGE</span><span id="dStorage" class="diag-value">—</span></div><div class="diag-box"><span class="diag-label">KILLERS HABILITADOS</span><span id="dEnabled" class="diag-value">—</span></div><div class="diag-box"><span class="diag-label">KILLERS DESHABILITADOS</span><span id="dDisabled" class="diag-value">—</span></div><div class="diag-box"><span class="diag-label">NOMBRES AGREGADOS</span><span id="dDonors" class="diag-value">—</span></div></div><div id="dEnabledList" class="diag-list"></div><div id="dDisabledList" class="diag-list"></div><div id="dBonusList" class="diag-list"></div><div id="dUpdated" class="diag-list"></div></section><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div id="winnerDonor" class="winner-donor" hidden></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn" disabled>GIRAR</button></div><p id="killerSimulationNote" class="simulation-note">ESPERANDO DIAGNÓSTICO...</p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const KEY='sanlean-roulette-simulation-v1',killers=await loadJSON('data/killers.json'),canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),note=document.getElementById('killerSimulationNote'),winnerDonor=document.getElementById('winnerDonor');let sim={},spinning=false,lastEntries=[];const frameImg=await loadImage('Rectangulo.png').catch(()=>null),cache=new Map();function read(){try{sim=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){sim={}}sim.weights=sim.weights||{};sim.bonusEntries=sim.bonusEntries||{};return sim}function weight(k){const v=sim.weights['killers:'+k.key];return v===undefined?1:Math.max(0,Number(v)||0)}function donorNames(k){const v=sim.bonusEntries['killers:'+k.key];return Array.isArray(v)?v.map(x=>String(x||'').trim()).filter(Boolean):[]}function buildEntries(){read();const list=[];for(const k of killers){const w=weight(k);if(w<=0||!k.image)continue;list.push({item:k,donor:null,id:k.key+':base'});for(const [i,name] of donorNames(k).entries())list.push({item:k,donor:name,id:k.key+':donor:'+i});const unnamed=Math.max(0,w-1-donorNames(k).length);for(let i=0;i<unnamed;i++)list.push({item:k,donor:null,id:k.key+':extra:'+i})}return list}function diagnose(){read();const enabled=killers.filter(k=>weight(k)>0),disabled=killers.filter(k=>weight(k)<=0),donated=[];killers.forEach(k=>donorNames(k).forEach(n=>donated.push(k.name+' = '+n)));document.getElementById('dStorage').textContent=localStorage.getItem(KEY)?'ENCONTRADA':'NO ENCONTRADA';document.getElementById('dEnabled').textContent=enabled.length+' / '+killers.length;document.getElementById('dDisabled').textContent=disabled.length+' / '+killers.length;document.getElementById('dDonors').textContent=donated.length;document.getElementById('dEnabledList').innerHTML='<b>HABILITADOS:</b> '+enabled.map(k=>k.name).join(' · ');document.getElementById('dDisabledList').innerHTML='<b>DESHABILITADOS:</b> '+disabled.map(k=>k.name).join(' · ');document.getElementById('dBonusList').innerHTML='<b>AGREGADOS:</b> '+(donated.join(' · ')||'NINGUNO');document.getElementById('dUpdated').innerHTML='<b>updatedAt:</b> '+(sim.updatedAt||'NO EXISTE');btn.disabled=!localStorage.getItem(KEY)||enabled.length<1;note.innerHTML=`LA RULETA ESTÁ CONSTRUIDA CON <span class="accent">${enabled.length} KILLERS HABILITADOS</span> Y ${donated.length} PARTICIPACIONES CON NOMBRE.`}function img(k){if(cache.has(k.key))return cache.get(k.key);const im=new Image();im.src=k.image;cache.set(k.key,im);return im}killers.forEach(img);function setup(resize=true){const w=canvas.clientWidth||1180,h=canvas.clientHeight||370,d=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');if(resize){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h}}function fit(ctx,im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function draw(ctx,e,x,itemW,h,selected=false,alpha=1){const k=e.item,im=img(k),scale=selected?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,left=cx-cw/2,top=h/2-ch/2;ctx.save();ctx.globalAlpha=alpha;if(selected&&e.donor){ctx.shadowColor='#ff003c';ctx.shadowBlur=30}ctx.fillStyle='rgba(3,3,4,.94)';ctx.fillRect(left,top,cw,ch);ctx.shadowBlur=0;if(frameImg){ctx.save();ctx.globalAlpha=.72;ctx.drawImage(frameImg,left,top,cw,ch);ctx.restore()}if(im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(left+8,top+7,cw-16,ch-50);ctx.clip();ctx.filter='brightness(1.23) contrast(1.035)';fit(ctx,im,left+8,top+7,cw-16,ch-50);ctx.restore()}ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${selected?19:17}px Montserrat,Arial,sans-serif`;ctx.fillText(k.name.toUpperCase(),cx,top+ch-31,cw-18);ctx.restore()}function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}function render(seq,pos,selected=-1){const{ctx,w,h}=setup(false),iw=210,center=w/2;ctx.clearRect(0,0,w,h);const base=Math.floor(pos);for(let i=Math.max(0,base-5);i<=Math.min(seq.length-1,base+5);i++){const x=center+(i-pos)*iw-iw/2;if(x<-iw*1.3||x>w+iw*.3)continue;draw(ctx,seq[i],x,iw,h,i===selected,Math.max(.72,1-Math.abs(x+iw/2-center)/(w*1.6)))}}function makeLongDeck(entries){const out=[];while(out.length<Math.max(80,entries.length*7))out.push(...shuffle(entries));return out}function idle(){diagnose();const entries=buildEntries();lastEntries=entries;setup(true);if(!entries.length)return;let row=makeLongDeck(entries).slice(0,11);render(row,5,-1)}async function spin(){if(spinning)return;diagnose();const entries=buildEntries();if(entries.length<2)return;const deck=makeLongDeck(entries),targetIndex=deck.length-6,winner=deck[targetIndex],start=performance.now(),duration=8000;spinning=true;btn.disabled=true;winnerDonor.hidden=true;winnerDonor.textContent='';reel.classList.remove('donor-winner');setup(true);function tick(now){const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,5),pos=targetIndex*ease;render(deck,pos,-1);if(p<1)return requestAnimationFrame(tick);render(deck,targetIndex,targetIndex);if(winner.donor){winnerDonor.textContent=winner.donor;winnerDonor.hidden=false;reel.classList.add('donor-winner')}spinning=false;btn.disabled=false}requestAnimationFrame(tick)}btn.onclick=spin;window.addEventListener('focus',()=>{if(!spinning)idle()});window.addEventListener('storage',e=>{if(e.key===KEY&&!spinning)idle()});window.addEventListener('resize',()=>{if(!spinning)idle()});setTimeout(idle,100)})();</script></body></html>
