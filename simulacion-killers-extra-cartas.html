<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico MI PANEL — Killers</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.diagnostic{max-width:1180px;margin:18px auto 26px;padding:18px 20px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(15,15,18,.92);font:600 12px/1.55 Montserrat,Arial,sans-serif;color:#fff}.diagnostic h2{margin:0 0 12px;font-size:15px}.diag-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.diag-box{padding:12px;border-radius:10px;background:rgba(255,255,255,.055)}.diag-label{display:block;color:rgba(255,255,255,.52);font-size:10px}.diag-value{display:block;margin-top:4px;font-size:17px}.ok{color:#fff}.bad,.accent{color:#ff003c}.diag-list{margin-top:12px;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);word-break:break-word}.diag-list b{color:#ff003c}.diag-raw{margin-top:12px;padding:12px;max-height:210px;overflow:auto;border-radius:10px;background:#050507;color:rgba(255,255,255,.7);white-space:pre-wrap;font:500 10px/1.45 monospace}.simulation-note{text-align:center;color:rgba(255,255,255,.55);font:600 11px Montserrat,Arial,sans-serif}.winner-donor{position:absolute;z-index:50;left:50%;top:55%;transform:translate(-50%,-50%);color:#ff003c;font:800 22px/1 Montserrat,Arial,sans-serif;text-shadow:0 0 7px #000,-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505;pointer-events:none}.killer-reel.donor-winner canvas{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 24px #ff003c)}@media(max-width:800px){.diag-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><section class="diagnostic"><h2>DIAGNÓSTICO DE <span class="accent">MI PANEL</span></h2><div class="diag-grid"><div class="diag-box"><span class="diag-label">CLAVE EN LOCALSTORAGE</span><span id="dStorage" class="diag-value">—</span></div><div class="diag-box"><span class="diag-label">KILLERS HABILITADOS</span><span id="dEnabled" class="diag-value">—</span></div><div class="diag-box"><span class="diag-label">KILLERS DESHABILITADOS</span><span id="dDisabled" class="diag-value">—</span></div><div class="diag-box"><span class="diag-label">NOMBRES AGREGADOS</span><span id="dDonors" class="diag-value">—</span></div></div><div id="dEnabledList" class="diag-list"></div><div id="dDisabledList" class="diag-list"></div><div id="dBonusList" class="diag-list"></div><div id="dUpdated" class="diag-list"></div><div id="dRaw" class="diag-raw"></div></section><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div id="winnerDonor" class="winner-donor" hidden></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn" disabled>GIRAR</button></div><p id="killerSimulationNote" class="simulation-note">ESPERANDO DIAGNÓSTICO...</p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const SIM_KEY='sanlean-roulette-simulation-v1',killers=await loadJSON('data/killers.json'),canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),note=document.getElementById('killerSimulationNote'),winnerDonor=document.getElementById('winnerDonor');let sim={weights:{},bonusEntries:{}},killerSpinning=false,lastRow=null;const frameImg=await loadImage('Rectangulo.png').catch(()=>null),cache=new Map();function readState(){const raw=localStorage.getItem(SIM_KEY);let parsed=null,error=null;try{parsed=raw?JSON.parse(raw):null}catch(e){error=e}sim=parsed&&typeof parsed==='object'?Object.assign({weights:{},bonusEntries:{}},parsed):{weights:{},bonusEntries:{}};return{raw,parsed,error}}function weight(k){return Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1))}function donors(k){const v=sim.bonusEntries&&sim.bonusEntries['killers:'+k.key];return Array.isArray(v)?v.map(x=>String(x||'').trim()).filter(Boolean):[]}function diagnose(){const state=readState(),enabled=killers.filter(k=>weight(k)>0),disabled=killers.filter(k=>weight(k)===0),donated=[];killers.forEach(k=>donors(k).forEach(name=>donated.push(k.name+' = '+name)));const killerWeightKeys=Object.keys(sim.weights||{}).filter(k=>k.startsWith('killers:'));document.getElementById('dStorage').textContent=state.raw?'ENCONTRADA':'NO ENCONTRADA';document.getElementById('dStorage').className='diag-value '+(state.raw?'ok':'bad');document.getElementById('dEnabled').textContent=enabled.length+' / '+killers.length;document.getElementById('dDisabled').textContent=disabled.length+' / '+killers.length;document.getElementById('dDonors').textContent=donated.length;document.getElementById('dEnabledList').innerHTML='<b>HABILITADOS:</b> '+(enabled.map(k=>k.name).join(' · ')||'NINGUNO');document.getElementById('dDisabledList').innerHTML='<b>DESHABILITADOS:</b> '+(disabled.map(k=>k.name).join(' · ')||'NINGUNO');document.getElementById('dBonusList').innerHTML='<b>AGREGADOS:</b> '+(donated.join(' · ')||'NINGUNO');document.getElementById('dUpdated').innerHTML='<b>CLAVES killers: EN weights:</b> '+killerWeightKeys.length+' &nbsp; · &nbsp; <b>updatedAt:</b> '+(sim.updatedAt||'NO EXISTE');document.getElementById('dRaw').textContent=state.error?'ERROR JSON: '+state.error.message:(state.raw||'localStorage["'+SIM_KEY+'"] NO EXISTE EN ESTA PÁGINA.');const valid=!!state.raw&&!state.error&&enabled.length>0;btn.disabled=!valid;note.innerHTML=valid?`LA RULETA RECIBIRÁ <span class="accent">${enabled.length} KILLERS HABILITADOS</span> Y ${donated.length} PARTICIPACIONES CON NOMBRE.`:'LA RULETA ESTÁ BLOQUEADA HASTA QUE MI PANEL SEA LEÍDO CORRECTAMENTE.';return{enabled,disabled,donated,valid}}function getImg(k){if(cache.has(k.key))return cache.get(k.key);const img=new Image();img.src=k.image;cache.set(k.key,img);return img}killers.forEach(getImg);function setup(resize=true){const w=canvas.clientWidth||1180,h=canvas.clientHeight||370,d=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');if(resize){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h}}function fit(ctx,img,x,y,w,h){if(!img||!img.complete||!img.naturalWidth)return;const s=Math.min(w/img.naturalWidth,h/img.naturalHeight)*1.19,iw=img.naturalWidth*s,ih=img.naturalHeight*s;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function draw(ctx,e,x,itemW,h,selected=false,alpha=1){const k=e.item,img=getImg(k),scale=selected?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,left=cx-cw/2,top=cy-ch/2;ctx.save();ctx.globalAlpha=alpha;if(selected&&e.donor){ctx.shadowColor='#ff003c';ctx.shadowBlur=30}ctx.fillStyle='rgba(3,3,4,.94)';ctx.fillRect(left,top,cw,ch);ctx.shadowBlur=0;if(frameImg){ctx.save();ctx.globalAlpha=.72;ctx.drawImage(frameImg,left,top,cw,ch);ctx.restore()}if(img.complete&&img.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(left+8,top+7,cw-16,ch-50);ctx.clip();ctx.filter='brightness(1.23) contrast(1.035)';fit(ctx,img,left+8,top+7,cw-16,ch-50);ctx.restore()}ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${selected?19:17}px Montserrat,Arial,sans-serif`;ctx.fillText(k.name.toUpperCase(),cx,top+ch-31,cw-18);ctx.restore()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function entries(){diagnose();const out=[];killers.forEach(k=>{const w=weight(k);if(w===0||!k.image)return;const ds=donors(k);out.push({item:k,donor:null,id:k.key+':base'});ds.forEach((d,i)=>out.push({item:k,donor:d,id:k.key+':donor:'+i}));for(let i=0;i<Math.max(0,w-1-ds.length);i++)out.push({item:k,donor:null,id:k.key+':extra:'+i})});return out}function renderAt(seq,pos,selected=-1){const{ctx,w,h}=setup(false),iw=210,center=w/2;ctx.clearRect(0,0,w,h);for(let i=Math.max(0,Math.floor(pos)-5);i<=Math.min(seq.length-1,Math.ceil(pos)+5);i++){const x=center+(pos-i)*iw-iw/2;if(x<-iw*1.3||x>w+iw*.3)continue;draw(ctx,seq[i],x,iw,h,i===selected,Math.max(.74,1-Math.abs(x+iw/2-center)/(w*1.7)))}}function renderStatic(){setup(true);const list=entries();if(!list.length)return;let row=shuffle(list);const copy=[...row];while(row.length<7&&copy.length)row.push(...copy);renderAt(row.slice(0,7),Math.min(3,row.length-1),-1)}async function spin(){if(killerSpinning)return;const list=entries();if(list.length<2)return;winnerDonor.hidden=true;reel.classList.remove('donor-winner');const deck=[];while(deck.length<Math.max(45,list.length*3))deck.push(...shuffle(list));const targetIndex=deck.length-4,winner=deck[targetIndex],start=performance.now(),duration=8000;killerSpinning=true;btn.disabled=true;return new Promise(resolve=>{function frame(now){const p=Math.min(1,(now-start)/duration),q=1-Math.pow(1-p,4),pos=targetIndex*q;renderAt(deck,pos,-1);if(p<1)return requestAnimationFrame(frame);const from=targetIndex-3,last=deck.slice(from,targetIndex+4);renderAt(last,3,3);if(winner.donor){winnerDonor.textContent=winner.donor;winnerDonor.hidden=false;reel.classList.add('donor-winner')}killerSpinning=false;btn.disabled=false;resolve()}requestAnimationFrame(frame)})}btn.onclick=spin;window.addEventListener('focus',()=>{if(!killerSpinning){diagnose();renderStatic()}});window.addEventListener('storage',e=>{if(e.key===SIM_KEY&&!killerSpinning){diagnose();renderStatic()}});diagnose();setTimeout(renderStatic,100)})();</script></body></html>
