<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Killers — Círculo continuo</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.test-note{max-width:950px;margin:18px auto;text-align:center;color:rgba(255,255,255,.58);font:600 11px/1.55 Montserrat,Arial,sans-serif}.test-note strong,.test-note .donor-proof{color:#ff003c}.winner-donor{position:absolute;z-index:60;left:50%;top:54%;transform:translate(-50%,-50%);color:#ff003c;font:900 22px/1 Montserrat,Arial,sans-serif;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 7px #000;pointer-events:none;opacity:0;transition:opacity .18s}.winner-donor.show{opacity:1}.killer-reel.donor-win canvas{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 24px #ff003c)}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div id="winnerDonor" class="winner-donor"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinBtn">GIRAR</button></div><p id="testNote" class="test-note">CARGANDO PRUEBA...</p></main><script src="js/main.js"></script><script>(async()=>{const SIM_KEY='sanlean-roulette-simulation-v1';try{const response=await fetch('data/killers.json',{cache:'no-store'});if(!response.ok)throw new Error('No se pudo cargar killers.json');const killers=await response.json(),canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinBtn'),donorLabel=document.getElementById('winnerDonor'),note=document.getElementById('testNote');let spinning=false,lastWinner=null,sim={weights:{},bonusEntries:{}};const frameImg=new Image();frameImg.src='rectangulo-fondo.png';const cache=new Map();function reload(){try{sim={weights:{},bonusEntries:{},...JSON.parse(localStorage.getItem(SIM_KEY)||'{}')}catch{sim={weights:{},bonusEntries:{}}}}function weight(k){return Math.max(0,Number((sim.weights&&sim.weights['killers:'+k.key])??1))}function donors(k){return(sim.bonusEntries&&sim.bonusEntries['killers:'+k.key]||[]).map(v=>String(v||'').trim()).filter(Boolean)}function ring(){reload();const out=[];killers.forEach(k=>{if(!k||!k.image)return;const w=weight(k);if(w===0)return;const ds=donors(k);out.push({item:k,donor:null,id:k.key+':base'});ds.forEach((name,i)=>out.push({item:k,donor:name,id:k.key+':donor:'+i}));for(let i=0;i<Math.max(0,w-1-ds.length);i++)out.push({item:k,donor:null,id:k.key+':extra:'+i})});const d=out.filter(e=>e.donor),off=killers.filter(k=>weight(k)===0).length;note.innerHTML=`<strong>${out.length} CARTAS EN EL CÍRCULO</strong> · ${d.length} AGREGADAS DESDE MI PANEL · ${off} DESHABILITADAS`+(d.length?`<br><span class="donor-proof">${d.slice(0,6).map(e=>e.item.name+' = '+e.donor).join(' · ')}</span>`:'');return out}function setup(resize=true){const rect=reel.getBoundingClientRect(),w=Math.max(320,rect.width),h=Math.max(300,rect.height),d=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');canvas.style.width=w+'px';canvas.style.height=h+'px';if(resize){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h}}function getImg(k){if(cache.has(k.key))return cache.get(k.key);const im=new Image();im.decoding='async';im.src=k.image;im.onload=()=>{if(!spinning)renderIdle()};cache.set(k.key,im);return im}killers.forEach(getImg);function fit(ctx,im,x,y,w,h){if(!im||!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function draw(ctx,e,x,itemW,h,selected=false,alpha=1){const k=e.item,im=getImg(k),scale=selected?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,left=cx-cw/2,top=cy-ch/2;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='rgba(3,3,4,.94)';ctx.fillRect(left,top,cw,ch);if(frameImg.complete&&frameImg.naturalWidth){ctx.save();ctx.globalAlpha=.78;ctx.drawImage(frameImg,left,top,cw,ch);ctx.restore()}if(im&&im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(left+8,top+7,cw-16,ch-50);ctx.clip();ctx.filter='brightness(1.23) contrast(1.035)';fit(ctx,im,left+8,top+7,cw-16,ch-50);ctx.restore()}ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${selected?19:17}px Montserrat,Arial,sans-serif`;ctx.fillText(k.name.toUpperCase(),cx,top+ch-31,cw-18);ctx.restore()}function mod(n,m){return((n%m)+m)%m}function renderRing(entries,position,selected=false){const{ctx,w,h}=setup(false),iw=210,center=w/2,N=entries.length;ctx.clearRect(0,0,w,h);if(!N)return;const base=Math.floor(position),frac=position-base;for(let offset=-5;offset<=5;offset++){const logical=base+offset,index=mod(logical,N),x=center+(offset-frac)*iw-iw/2;if(x<-iw*1.3||x>w+iw*.3)continue;const dist=Math.abs(x+iw/2-center),isSelected=selected&&offset===0&&Math.abs(frac)<.001;draw(ctx,entries[index],x,iw,h,isSelected,Math.max(.74,1-dist/(w*1.7)))}}function renderIdle(){const entries=ring();setup(true);if(!entries.length)return;if(lastWinner){const idx=entries.findIndex(e=>e.id===lastWinner.id);renderRing(entries,idx<0?0:idx,true)}else renderRing(entries,0,false)}function spin(){if(spinning)return;const entries=ring();if(entries.length<2)return;donorLabel.classList.remove('show');donorLabel.textContent='';reel.classList.remove('donor-win');const N=entries.length,winnerIndex=Math.floor(Math.random()*N),winner=entries[winnerIndex],loops=5+Math.floor(Math.random()*3),startPos=0,endPos=loops*N+winnerIndex,start=performance.now(),duration=8000,brake=.76;spinning=true;btn.disabled=true;setup(true);function tick(now){const p=Math.min(1,(now-start)/duration);let progress;if(p<brake)progress=(p/brake)*.84;else{const q=(p-brake)/(1-brake);progress=.84+.16*(1-Math.pow(1-q,4))}renderRing(entries,startPos+(endPos-startPos)*progress,false);if(p<1)return requestAnimationFrame(tick);lastWinner=winner;renderRing(entries,winnerIndex,true);if(winner.donor){donorLabel.textContent=winner.donor;donorLabel.classList.add('show');reel.classList.add('donor-win')}spinning=false;btn.disabled=false}requestAnimationFrame(tick)}btn.addEventListener('click',spin);window.addEventListener('resize',()=>{if(!spinning)renderIdle()});window.addEventListener('focus',()=>{if(!spinning){lastWinner=null;renderIdle()}});window.addEventListener('storage',e=>{if(e.key===SIM_KEY&&!spinning){lastWinner=null;renderIdle()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!spinning){lastWinner=null;renderIdle()}});frameImg.onload=renderIdle;requestAnimationFrame(()=>requestAnimationFrame(renderIdle))}catch(err){console.error(err);note.innerHTML='<strong>ERROR:</strong> '+String(err&&err.message?err.message:err)}})();</script></body></html>
