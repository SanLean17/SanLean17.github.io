<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Killers + MI PANEL</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/killer-page.css"><style>.sim-status{width:min(1180px,100%);margin:-22px auto 22px;padding:11px 16px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(5,5,7,.58);text-align:center;color:rgba(255,255,255,.72);font:700 10px/1.4 Montserrat,Arial,sans-serif}.sim-status strong,.sim-debug b{color:#ff003c}.sim-debug{width:min(1180px,100%);margin:4px auto 0;text-align:center;color:rgba(255,255,255,.5);font:600 10px/1.5 Montserrat,Arial,sans-serif}.killer-card.donated .killer-card-donor{display:none}.killer-card-donor{position:absolute;z-index:9;left:7px;right:7px;top:55%;transform:translateY(-50%);text-align:center;color:#ff003c;font:800 22px/1 Montserrat,Arial,sans-serif;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 7px #000}.killer-card.selected.donated{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 22px #ff003c)}.killer-card.selected.donated .killer-card-donor{display:block;font-size:25px}.killer-card.selected.donated .killer-card-name{font-size:18px}.killer-spin-controls{margin-top:36px}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div id="status" class="sim-status">LEYENDO <strong>MI PANEL</strong>...</div><div class="killer-reel" id="killerReel"><div class="killer-track" id="killerTrack"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn" disabled>GIRAR</button></div><div id="debug" class="sim-debug"></div></main><script>(()=>{'use strict';const STORAGE='sanlean-roulette-simulation-v1',DATA='data/killers.json',FRAME='rectangulo-fondo.png';const track=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),status=document.getElementById('status'),debug=document.getElementById('debug');let killers=[],state={},entries=[],spinning=false;const CARD_W=196,GAP=14,STEP=CARD_W+GAP;function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function read(){try{state=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(e){state={}}state.weights=state.weights||{};state.bonusEntries=state.bonusEntries||{}}function weight(k){const v=state.weights['killers:'+k.key];return v===undefined?1:Math.max(0,Number(v)||0)}function donors(k){const v=state.bonusEntries['killers:'+k.key];return Array.isArray(v)?v.map(x=>String(x||'').trim()).filter(Boolean):[]}function rebuild(){read();entries=[];for(const k of killers){const w=weight(k);if(w<=0)continue;entries.push({killer:k,donor:null,id:k.key+':base'});const ds=donors(k);ds.forEach((d,i)=>entries.push({killer:k,donor:d,id:k.key+':donor:'+i}));for(let i=0;i<Math.max(0,w-1-ds.length);i++)entries.push({killer:k,donor:null,id:k.key+':extra:'+i})}const enabled=killers.filter(k=>weight(k)>0),disabled=killers.filter(k=>weight(k)<=0),named=entries.filter(e=>e.donor);status.innerHTML=`MI PANEL: <strong>${enabled.length} KILLERS HABILITADOS</strong> · ${disabled.length} DESHABILITADOS · ${named.length} PARTICIPACIONES CON NOMBRE`;debug.innerHTML=`MAZO REAL: <b>${entries.length} CARTAS</b> · ${enabled.map(k=>esc(k.name)).join(' · ')}`;btn.disabled=entries.length<2}function card(e){return `<div class="killer-card${e.donor?' donated':''}" data-id="${esc(e.id)}"><img class="killer-card-frame" src="${FRAME}" alt=""><img class="killer-card-portrait" src="${esc(e.killer.image)}" alt="${esc(e.killer.name)}"><div class="killer-card-name">${esc(e.killer.name)}</div>${e.donor?`<div class="killer-card-donor">${esc(e.donor)}</div>`:''}</div>`}function longDeck(min){const out=[];while(out.length<min)out.push(...shuffle(entries));return out.slice(0,Math.max(min,entries.length*8))}function setDeck(deck){track.innerHTML=deck.map(card).join('');track.style.transition='none'}function offset(index){return reel.clientWidth/2-(index*STEP+CARD_W/2)}function idle(){rebuild();if(!entries.length){track.innerHTML='';return}const deck=longDeck(Math.max(18,entries.length*3));setDeck(deck);const index=Math.min(6,deck.length-1);track.style.transform=`translate3d(${offset(index)}px,-50%,0)`}function spin(){if(spinning)return;rebuild();if(entries.length<2)return;spinning=true;btn.disabled=true;const deck=longDeck(Math.max(100,entries.length*10));setDeck(deck);const start=5,target=deck.length-7;track.style.transform=`translate3d(${offset(start)}px,-50%,0)`;track.getBoundingClientRect();requestAnimationFrame(()=>{track.style.transition='transform 8s cubic-bezier(.08,.62,.12,1)';track.style.transform=`translate3d(${offset(target)}px,-50%,0)`});let done=false;const finish=()=>{if(done)return;done=true;track.removeEventListener('transitionend',finish);const winner=track.children[target];if(winner)winner.classList.add('selected');spinning=false;btn.disabled=false};track.addEventListener('transitionend',finish,{once:true});setTimeout(finish,8400)}btn.addEventListener('click',spin);window.addEventListener('focus',()=>{if(!spinning)idle()});window.addEventListener('storage',e=>{if(e.key===STORAGE&&!spinning)idle()});window.addEventListener('resize',()=>{if(!spinning)idle()});fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar killers.json');return r.json()}).then(data=>{killers=data;idle()}).catch(err=>{status.innerHTML='<strong>ERROR:</strong> '+esc(err.message);console.error(err)})})();</script></body></html>
