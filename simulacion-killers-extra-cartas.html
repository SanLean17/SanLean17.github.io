<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulación Ruleta de Killers — SanLean</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.simulation-note{max-width:900px;margin:18px auto 0;text-align:center;color:rgba(255,255,255,.55);font:600 10px/1.5 Montserrat,Arial,sans-serif}.simulation-note strong{color:#ff003c}.winner-donor{position:absolute;z-index:50;left:50%;top:55%;transform:translate(-50%,-50%);color:#ff003c;font:800 22px/1 Montserrat,Arial,sans-serif;text-shadow:0 0 7px #000,-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505;pointer-events:none}.killer-reel.donor-winner canvas{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 24px #ff003c)}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div id="winnerDonor" class="winner-donor" hidden></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinKillerBtn">GIRAR</button></div><p id="killerSimulationNote" class="simulation-note">LEYENDO <strong>MI PANEL</strong>...</p></main><script src="js/main.js"></script><script src="js/roulette.js"></script><script>(async()=>{const killers=await loadJSON('data/killers.json');const SIM_KEY='sanlean-roulette-simulation-v1';let sim={weights:{},bonusEntries:{}};function reloadSim(){try{sim=Object.assign({weights:{},bonusEntries:{}},JSON.parse(localStorage.getItem(SIM_KEY)||'{}'))}catch(e){sim={weights:{},bonusEntries:{}}}}reloadSim();const weight=(item)=>Math.max(0,Number((sim.weights&&sim.weights['killers:'+item.key])??1));const donors=(item)=>(sim.bonusEntries&&sim.bonusEntries['killers:'+item.key]||[]).filter(Boolean);const canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinKillerBtn'),note=document.getElementById('killerSimulationNote'),winnerDonor=document.getElementById('winnerDonor');let killerSpinning=false,lastRow=null;const frameImg=await loadImage('Rectangulo.png').catch(()=>null),killerImageCache=new Map();function setup(resize=true){const w=canvas.clientWidth||1180,h=canvas.clientHeight||370,dpr=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');if(resize&&(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr))){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h}}function getKillerImage(k){if(!k||!k.image)return null;if(killerImageCache.has(k.key))return killerImageCache.get(k.key);const img=new Image();img.decoding='async';img.src=k.image;killerImageCache.set(k.key,img);return img}killers.forEach(getKillerImage);function fitPortrait(ctx,img,x,y,w,h){if(!img||!img.complete||!img.naturalWidth)return;const s=Math.min(w/img.naturalWidth,h/img.naturalHeight)*1.19,iw=img.naturalWidth*s,ih=img.naturalHeight*s;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function wrapName(name){const n=name.toUpperCase();if(n.length>20&&n.includes(' ')){const words=n.split(' ');let a='',b='';for(const word of words){if((a+' '+word).trim().length<=Math.ceil(n.length/2)+2)a=(a+' '+word).trim();else b=(b+' '+word).trim()}return b?[a,b]:[n]}return[n]}function drawCard(ctx,entry,x,itemW,h,selected=false,alpha=1){const k=entry.item,img=getKillerImage(k);ctx.save();ctx.globalAlpha=alpha;const scale=selected?1.22:1,cardW=(itemW-14)*scale,cardH=(h-92)*scale,cx=x+itemW/2,cy=h/2,cardX=cx-cardW/2,cardY=cy-cardH/2;if(selected&&entry.donor){ctx.shadowColor='#ff003c';ctx.shadowBlur=30}ctx.fillStyle='rgba(3,3,4,.94)';ctx.fillRect(cardX,cardY,cardW,cardH);ctx.shadowBlur=0;if(frameImg){ctx.save();ctx.globalAlpha=.72;ctx.drawImage(frameImg,cardX,cardY,cardW,cardH);ctx.restore()}if(img&&img.complete&&img.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(cardX+8,cardY+7,cardW-16,cardH-50);ctx.clip();ctx.filter='brightness(1.23) contrast(1.035)';fitPortrait(ctx,img,cardX+8,cardY+7,cardW-16,cardH-50);ctx.filter='none';ctx.restore()}ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=4;const lines=wrapName(k.name),fontSize=selected?19:17;ctx.font=`800 ${fontSize}px Montserrat,Arial,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const baseY=cardY+cardH-(lines.length===2?43:31);lines.forEach((line,i)=>ctx.fillText(line,cx,baseY+i*(fontSize+2),cardW-18));ctx.restore()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function killerEntries(){reloadSim();const out=[];killers.forEach(k=>{const w=weight(k);if(w===0||!k.image)return;const ds=donors(k);out.push({item:k,donor:null,entryId:k.key+':default'});ds.forEach((d,i)=>out.push({item:k,donor:d,entryId:k.key+':donor:'+i}));const anonymousExtras=Math.max(0,w-1-ds.length);for(let i=0;i<anonymousExtras;i++)out.push({item:k,donor:null,entryId:k.key+':extra:'+i})});const added=out.filter(e=>e.donor).length,disabled=killers.filter(k=>weight(k)===0).length;note.innerHTML=`<strong>${out.length} CARTAS ACTIVAS</strong> · ${added} AGREGADAS DESDE MI PANEL · ${disabled} KILLERS DESHABILITADOS`;return out}function buildSpinDeck(entries){const deck=shuffle(entries);if(deck.length<2)return{deck,targetIndex:0,target:deck[0]};const targetIndex=Math.max(1,deck.length-4),randomIndex=Math.floor(Math.random()*deck.length);[deck[targetIndex],deck[randomIndex]]=[deck[randomIndex],deck[targetIndex]];return{deck,targetIndex,target:deck[targetIndex]}}function renderAt(seq,pos,selectedIndex=-1){const{ctx,w,h}=setup(false),itemW=210,center=w/2;ctx.clearRect(0,0,w,h);const first=Math.max(0,Math.floor(pos)-5),last=Math.min(seq.length-1,Math.ceil(pos)+5);for(let i=first;i<=last;i++){const x=center+(pos-i)*itemW-itemW/2;if(x<-itemW*1.3||x>w+itemW*.3)continue;const dist=Math.abs(x+itemW/2-center);drawCard(ctx,seq[i],x,itemW,h,i===selectedIndex,Math.max(.74,1-dist/(w*1.7)))}}function renderStatic(){setup(true);const entries=killerEntries();if(!entries.length)return;if(lastRow){const centerIndex=Math.floor(lastRow.length/2);renderAt(lastRow,centerIndex,centerIndex)}else{let row=shuffle(entries);if(row.length<7){const copy=[...row];while(row.length<7)row.push(...copy)}renderAt(row.slice(0,7),3,-1)}}function spin(entries){const{deck,targetIndex,target}=buildSpinDeck(entries);setup(true);const duration=8000,startPos=0,endPos=targetIndex,start=performance.now(),brakeStart=.78;return new Promise(resolve=>{function frame(now){const p=Math.min(1,(now-start)/duration);let progress;if(p<brakeStart)progress=(p/brakeStart)*.86;else{const q=(p-brakeStart)/(1-brakeStart);progress=.86+.14*(1-Math.pow(1-q,4))}renderAt(deck,startPos+(endPos-startPos)*progress,-1);if(p<1)return requestAnimationFrame(frame);const from=Math.max(0,targetIndex-3),to=Math.min(deck.length,targetIndex+4);lastRow=deck.slice(from,to);const selected=targetIndex-from;renderAt(lastRow,selected,selected);resolve(target)}requestAnimationFrame(frame)})}function clearWinner(){winnerDonor.hidden=true;winnerDonor.textContent='';reel.classList.remove('donor-winner')}async function runSpin(){if(killerSpinning)return;const entries=killerEntries();if(entries.length<2)return;killerSpinning=true;btn.disabled=true;clearWinner();try{const winner=await spin(entries);if(winner&&winner.donor){winnerDonor.textContent=winner.donor;winnerDonor.hidden=false;reel.classList.add('donor-winner')}}finally{killerSpinning=false;btn.disabled=false}}btn.onclick=runSpin;setTimeout(renderStatic,120);window.addEventListener('load',renderStatic);window.addEventListener('resize',()=>{if(!killerSpinning)renderStatic()});window.addEventListener('focus',()=>{if(!killerSpinning){lastRow=null;clearWinner();renderStatic()}});window.addEventListener('storage',e=>{if(e.key===SIM_KEY&&!killerSpinning){lastRow=null;clearWinner();renderStatic()}})})();</script></body></html>
