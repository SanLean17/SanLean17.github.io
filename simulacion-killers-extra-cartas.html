<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Killers — Cartas extra</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/roulette.css"><link rel="stylesheet" href="css/killer-page.css"><style>.test-note{max-width:900px;margin:18px auto;text-align:center;color:rgba(255,255,255,.58);font:600 11px/1.5 Montserrat,Arial,sans-serif}.test-note strong{color:#ff003c}.winner-donor{position:absolute;z-index:60;left:50%;top:54%;transform:translate(-50%,-50%);color:#ff003c;font:900 22px/1 Montserrat,Arial,sans-serif;text-shadow:-2px -2px 0 #050505,2px -2px 0 #050505,-2px 2px 0 #050505,2px 2px 0 #050505,0 0 7px #000;pointer-events:none;opacity:0;transition:opacity .2s}.winner-donor.show{opacity:1}.killer-reel.donor-win canvas{filter:drop-shadow(0 0 13px #ff003c) drop-shadow(0 0 24px #ff003c)}</style></head><body class="page-bg killer-page-bg"><header class="site-header"><div class="header-inner"><a href="index.html" class="logo"><img src="logo.png" alt="SanLean"><span class="logo-text"><span class="accent">SAN</span>LEAN</span></a></div></header><main class="container roulette-page killer-page"><h1>RULETA DE <span class="accent">KILLERS</span> DE DBD</h1><div class="killer-reel" id="killerReel"><canvas id="killerTrack"></canvas><div id="winnerDonor" class="winner-donor"></div><div class="reel-edge reel-edge-left"></div><div class="reel-edge reel-edge-right"></div><div class="reel-marker reel-marker-top"></div><div class="reel-marker reel-marker-bottom"></div></div><div class="killer-spin-controls"><button class="btn" id="spinBtn">GIRAR</button></div><p id="testNote" class="test-note">CARGANDO PRUEBA...</p></main><script src="js/main.js"></script><script>(async()=>{try{const killers=await loadJSON('data/killers.json'),canvas=document.getElementById('killerTrack'),reel=document.getElementById('killerReel'),btn=document.getElementById('spinBtn'),donorLabel=document.getElementById('winnerDonor'),note=document.getElementById('testNote');const EXTRA_COUNT=4,DONOR_NAMES=['Woker','Leandro','Maxi','Prueba'];let spinning=false,lastRow=null;const frameImg=new Image();frameImg.src='rectangulo-fondo.png';const cache=new Map(),trapper=killers.find(k=>/tramp/i.test(k.name))||killers[0];function entries(){const base=killers.filter(k=>k.image).map(k=>({item:k,donor:null,id:k.key+':base'}));DONOR_NAMES.forEach((name,i)=>base.push({item:trapper,donor:name,id:trapper.key+':extra:'+i}));note.innerHTML=`<strong>${base.length} CARTAS EN TOTAL</strong> · ${base.length-EXTRA_COUNT} KILLERS BASE · ${EXTRA_COUNT} CARTAS EXTRA DE ${trapper.name.toUpperCase()}<br>Woker, Leandro, Maxi y Prueba existen como participaciones separadas, pero sus nombres solo aparecen si gana esa carta.`;return base}function setup(resize=true){const rect=reel.getBoundingClientRect(),w=Math.max(320,rect.width),h=Math.max(300,rect.height),d=Math.min(window.devicePixelRatio||1,2),ctx=canvas.getContext('2d');canvas.style.width=w+'px';canvas.style.height=h+'px';if(resize){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h}}function getImg(k){if(cache.has(k.key))return cache.get(k.key);const im=new Image();im.decoding='async';im.src=k.image;im.onload=()=>{if(!spinning)staticView()};cache.set(k.key,im);return im}killers.forEach(getImg);function fit(ctx,im,x,y,w,h){if(!im||!im.complete||!im.naturalWidth)return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight)*1.19,iw=im.naturalWidth*s,ih=im.naturalHeight*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}function draw(ctx,e,x,itemW,h,selected=false,alpha=1){const k=e.item,im=getImg(k),scale=selected?1.22:1,cw=(itemW-14)*scale,ch=(h-92)*scale,cx=x+itemW/2,cy=h/2,left=cx-cw/2,top=cy-ch/2;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='rgba(3,3,4,.94)';ctx.fillRect(left,top,cw,ch);if(frameImg.complete&&frameImg.naturalWidth){ctx.save();ctx.globalAlpha=.78;ctx.drawImage(frameImg,left,top,cw,ch);ctx.restore()}if(im&&im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(left+8,top+7,cw-16,ch-50);ctx.clip();ctx.filter='brightness(1.23) contrast(1.035)';fit(ctx,im,left+8,top+7,cw-16,ch-50);ctx.restore()}ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${selected?19:17}px Montserrat,Arial,sans-serif`;ctx.fillText(k.name.toUpperCase(),cx,top+ch-31,cw-18);ctx.restore()}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function render(seq,pos,selected=-1){const{ctx,w,h}=setup(false),iw=210,center=w/2;ctx.clearRect(0,0,w,h);for(let i=Math.max(0,Math.floor(pos)-5);i<=Math.min(seq.length-1,Math.ceil(pos)+5);i++){const x=center+(pos-i)*iw-iw/2;if(x<-iw*1.3||x>w+iw*.3)continue;draw(ctx,seq[i],x,iw,h,i===selected,Math.max(.74,1-Math.abs(x+iw/2-center)/(w*1.7)))}}function staticView(){const pool=entries();setup(true);let row=shuffle(pool);while(row.length<7)row=row.concat(row);render(row.slice(0,7),3,-1)}function spin(){if(spinning)return;donorLabel.classList.remove('show');donorLabel.textContent='';reel.classList.remove('donor-win');const pool=entries(),winner=pool[Math.floor(Math.random()*pool.length)],deck=[];while(deck.length<70){for(const e of shuffle(pool)){if(deck.length>=70)break;deck.push(e)}}deck.push(winner);const target=deck.length-1,start=performance.now(),duration=8000,brake=.78;spinning=true;btn.disabled=true;setup(true);function tick(now){const p=Math.min(1,(now-start)/duration),progress=p<brake?(p/brake)*.86:.86+.14*(1-Math.pow(1-(p-brake)/(1-brake),4));render(deck,target*progress,-1);if(p<1)return requestAnimationFrame(tick);const from=Math.max(0,target-3),row=deck.slice(from,Math.min(deck.length,target+4)),sel=target-from;lastRow=row;render(row,sel,sel);if(winner.donor){donorLabel.textContent=winner.donor;donorLabel.classList.add('show');reel.classList.add('donor-win')}spinning=false;btn.disabled=false}requestAnimationFrame(tick)}btn.addEventListener('click',spin);window.addEventListener('resize',()=>{if(!spinning)staticView()});frameImg.onload=staticView;requestAnimationFrame(()=>requestAnimationFrame(staticView))}catch(err){console.error(err);document.getElementById('testNote').innerHTML='<strong>ERROR AL CARGAR LA SIMULACIÓN.</strong> Actualizá con Ctrl + F5.'}})();</script></body></html>
